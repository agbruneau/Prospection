<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="Sites d'application de la gouvernance dans la boucle d'un agent">
<style>
:root{--ink:#1c1a17;--bg:#f9f7f7;--grey:#6b6459;--line:#ddd8d2;--card:#f0eeec;--blue:#1565c0;--wash:#e3ecf7}
@media (prefers-color-scheme:dark){:root{--ink:#f9f7f7;--bg:#282623;--grey:#b0aba6;--line:#453f39;--card:#32302c;--blue:#a5d6fe;--wash:#2f3a47}}
text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:12px}
.t{font-size:12.5px;font-weight:700;text-anchor:middle}.s{font-size:10.5px;fill:var(--grey);text-anchor:middle}
.box{fill:var(--card);stroke:var(--ink);stroke-width:1}
.gate{fill:var(--wash);stroke:var(--blue);stroke-width:1.5}
.hum{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.ar{stroke:var(--ink);stroke-width:1.2;fill:none;marker-end:url(#m)}
.ard{stroke:var(--blue);stroke-width:1.3;fill:none;stroke-dasharray:6 4;marker-end:url(#mb)}
</style>
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--blue)"/></marker>
</defs>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<!-- humain -->
<rect x="320" y="14" width="160" height="40" class="hum"/>
<text x="400" y="38" class="t">Humain (escalade)</text>
<!-- rangée 1 -->
<rect x="30" y="90" width="160" height="56" class="box"/>
<text x="110" y="114" class="t">Intention et plan</text>
<text x="110" y="132" class="s">but, contraintes, rôle</text>
<rect x="220" y="90" width="160" height="56" class="box"/>
<text x="300" y="114" class="t">Action proposée</text>
<text x="300" y="132" class="s">appel d'outil ou message</text>
<rect x="410" y="90" width="160" height="56" class="gate"/>
<text x="490" y="114" class="t">Porte pré-action</text>
<text x="490" y="132" class="s">permis, interdit, obligation</text>
<rect x="600" y="90" width="160" height="56" class="box"/>
<text x="680" y="110" class="t">Exécution</text>
<text x="680" y="126" class="s">outil MCP · message A2A</text>
<text x="680" y="139" class="s">bac à sable, portée restreinte</text>
<!-- rangée 2 -->
<rect x="600" y="230" width="160" height="56" class="gate"/>
<text x="680" y="254" class="t">Moniteur en cours</text>
<text x="680" y="272" class="s">dérive d'objectif, anomalies</text>
<rect x="410" y="230" width="160" height="56" class="box"/>
<text x="490" y="254" class="t">Résultat et état</text>
<text x="490" y="272" class="s">mémoire, chemin d'exécution</text>
<rect x="220" y="230" width="160" height="56" class="gate"/>
<text x="300" y="254" class="t">Auditeur post-action</text>
<text x="300" y="272" class="s">provenance, conformité, rejeu</text>
<rect x="30" y="230" width="160" height="56" class="box"/>
<text x="110" y="254" class="t">Rétroaction d'assurance</text>
<text x="110" y="272" class="s">preuves vers la conception</text>
<!-- flèches de la boucle -->
<line x1="190" y1="118" x2="218" y2="118" class="ar"/>
<line x1="380" y1="118" x2="408" y2="118" class="ar"/>
<line x1="570" y1="118" x2="598" y2="118" class="ar"/>
<line x1="680" y1="146" x2="680" y2="228" class="ar"/>
<line x1="600" y1="258" x2="572" y2="258" class="ar"/>
<line x1="410" y1="258" x2="382" y2="258" class="ar"/>
<line x1="220" y1="258" x2="192" y2="258" class="ar"/>
<line x1="110" y1="230" x2="110" y2="148" class="ar"/>
<!-- escalade -->
<line x1="490" y1="90" x2="490" y2="56" class="ard"/>
<text x="500" y="76" class="s" text-anchor="start">escalade</text>
<!-- télémétrie -->
<rect x="30" y="330" width="740" height="82" class="box"/>
<text x="400" y="350" class="t">Plan de télémétrie : OpenTelemetry + attributs de gouvernance → moteur de politiques sur le chemin d'exécution (&lt; 200 ms)</text>
<text x="400" y="366" class="t">→ interventions graduées : blocage, redirection, limitation, escalade</text>
<text x="400" y="384" class="s">politique = fonction (identité de l'agent, chemin partiel, action proposée, état organisationnel) → probabilité de violation [82], [84], [87]</text>
<text x="400" y="400" class="s">les invites et le contrôle d'accès statique en sont des cas particuliers [82]</text>
<line x1="680" y1="286" x2="680" y2="328" class="ar"/>
<line x1="300" y1="286" x2="300" y2="328" class="ar"/>
<path d="M490,330 V310 H395 V150" class="ard"/>
<text x="386" y="200" class="s" text-anchor="end">alimente les portes</text>
</svg>
