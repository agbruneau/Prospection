<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-label="Horizons des projections : engagements des acteurs et prévisions des analystes, 2026 à 2030">
<style>
:root{--ink:#1c1a17;--bg:#f9f7f7;--grey:#6b6459;--line:#ddd8d2;--card:#f0eeec;--blue:#1565c0}
@media (prefers-color-scheme:dark){:root{--ink:#f9f7f7;--bg:#282623;--grey:#b0aba6;--line:#453f39;--card:#32302c;--blue:#a5d6fe}}
text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:11px;text-anchor:middle}
.h{font-size:13px;font-weight:700;text-anchor:start}.y{font-size:12.5px;font-weight:700}.g{fill:var(--grey)}
.axis{stroke:var(--ink);stroke-width:1.5;marker-end:url(#m)}
.tick{stroke:var(--ink);stroke-width:1}
.con{stroke:var(--grey);stroke-width:1}
.dot{fill:var(--blue)}
.lane{fill:none;stroke:var(--line);stroke-width:1}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker></defs>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<rect x="20" y="28" width="760" height="140" class="lane"/>
<rect x="20" y="222" width="760" height="130" class="lane"/>
<text x="30" y="46" class="h">Engagements datés des acteurs</text>
<text x="30" y="240" class="h">Prévisions des analystes</text>
<line x1="40" y1="195" x2="775" y2="195" class="axis"/>
<line x1="100" y1="190" x2="100" y2="200" class="tick"/><text x="100" y="214" class="y">T4 2026</text>
<line x1="260" y1="190" x2="260" y2="200" class="tick"/><text x="260" y="214" class="y">2027</text>
<line x1="420" y1="190" x2="420" y2="200" class="tick"/><text x="420" y="214" class="y">2028</text>
<line x1="560" y1="190" x2="560" y2="200" class="tick"/><text x="560" y="214" class="y">2029</text>
<line x1="700" y1="190" x2="700" y2="200" class="tick"/><text x="700" y="214" class="y">2030</text>
<!-- engagements -->
<circle cx="100" cy="195" r="3.5" class="dot"/><line x1="100" y1="190" x2="100" y2="130" class="con"/>
<text x="100" y="66">31 oct. : Evals en lecture seule</text>
<text x="100" y="80">30 nov. : retrait d'Agent Builder</text>
<text x="100" y="94">T4 : Joule A2A bidirectionnel GA</text>
<text x="100" y="108">automne : EFS par phases</text>
<text x="100" y="122" class="g">semaine du 3 sept. : Astra en API</text>
<circle cx="260" cy="195" r="3.5" class="dot"/><line x1="260" y1="190" x2="260" y2="130" class="con"/>
<text x="260" y="66">fin juil. : retrait possible des</text>
<text x="260" y="80">fonctions dépréciées de MCP</text>
<text x="260" y="94">1er sept. : Fable 5.1 (au plus tôt)</text>
<text x="260" y="108">2 déc. : AI Act, haut risque</text>
<circle cx="420" cy="195" r="3.5" class="dot"/><line x1="420" y1="190" x2="420" y2="130" class="con"/>
<text x="420" y="66">2 août : AI Act,</text>
<text x="420" y="80">dispositions restantes</text>
<text x="630" y="66" class="g">aucun engagement daté</text>
<text x="630" y="80" class="g">au-delà de 2028 dans</text>
<text x="630" y="94" class="g">les sources lues</text>
<!-- prévisions -->
<circle cx="100" cy="195" r="3.5" class="dot"/><line x1="100" y1="200" x2="100" y2="252" class="con"/>
<text x="100" y="266">fin 2026 : 40 % des applis</text>
<text x="100" y="280">avec agents (Gartner)</text>
<text x="100" y="294">IDC : 40 % des rôles G2000</text>
<circle cx="260" cy="195" r="3.5" class="dot"/><line x1="260" y1="200" x2="260" y2="252" class="con"/>
<text x="260" y="266">> 40 % des projets annulés</text>
<text x="260" y="280">(Gartner, cité par Deloitte)</text>
<text x="260" y="294">« deux ou trois standards</text>
<text x="260" y="308">dominants » (Deloitte)</text>
<circle cx="420" cy="195" r="3.5" class="dot"/><line x1="420" y1="200" x2="420" y2="252" class="con"/>
<text x="420" y="266">33 % des logiciels agentiques</text>
<text x="420" y="280">15 % des décisions autonomes</text>
<text x="420" y="294">(Gartner, cité par Deloitte)</text>
<circle cx="560" cy="195" r="3.5" class="dot"/><line x1="560" y1="200" x2="560" y2="252" class="con"/>
<text x="560" y="266">10× plus de données</text>
<text x="560" y="280">issues du physique</text>
<text x="560" y="294">(Gartner)</text>
<circle cx="700" cy="195" r="3.5" class="dot"/><line x1="700" y1="200" x2="700" y2="252" class="con"/>
<text x="700" y="266">50 % des échecs liés à la</text>
<text x="700" y="280">gouvernance à l'exécution et</text>
<text x="700" y="294">à l'interopérabilité (Gartner)</text>
<text x="700" y="308">marché : 35 à 45 G$ (Deloitte)</text>
<text x="700" y="322">couches sémantiques universelles</text>
<text x="30" y="365" class="g" style="text-anchor:start">Sources : tableau 5 et section 11.2 [3], [19], [33], [37], [53]–[55], [58], [64], [65], [72].</text>
</svg>
