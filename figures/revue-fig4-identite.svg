<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Chaîne d'identité et de délégation entre utilisateur, agents, serveur MCP et système">
<style>
:root{--ink:#1c1a17;--bg:#f9f7f7;--grey:#6b6459;--line:#ddd8d2;--card:#f0eeec;--blue:#1565c0;--wash:#e3ecf7}
@media (prefers-color-scheme:dark){:root{--ink:#f9f7f7;--bg:#282623;--grey:#b0aba6;--line:#453f39;--card:#32302c;--blue:#a5d6fe;--wash:#2f3a47}}
text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:12px}
.t{font-size:13px;font-weight:700;text-anchor:middle}.s{font-size:10.5px;fill:var(--grey);text-anchor:middle}
.box{fill:var(--card);stroke:var(--ink);stroke-width:1}
.band{fill:var(--wash);stroke:var(--ink);stroke-width:1}
.ar{stroke:var(--ink);stroke-width:1.2;fill:none;marker-end:url(#m)}
.ard{stroke:var(--blue);stroke-width:1.3;fill:none;stroke-dasharray:6 4;marker-end:url(#mb)}
</style>
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--blue)"/></marker>
</defs>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<!-- boîtes -->
<rect x="20" y="60" width="130" height="84" class="box"/>
<text x="85" y="82" class="t">Utilisateur</text>
<text x="85" y="102" class="s">OIDC · OAuth 2.1 (PKCE)</text>
<text x="85" y="117" class="s">CIBA pour l'intervention</text>
<text x="85" y="132" class="s">permissions en langage naturel</text>
<rect x="177" y="60" width="130" height="84" class="box"/>
<text x="242" y="82" class="t">Agent orchestrateur</text>
<text x="242" y="102" class="s">identité de charge de travail</text>
<text x="242" y="117" class="s">SPIFFE (SVID JWT)</text>
<text x="242" y="132" class="s">jeton d'intention (A-JWT)</text>
<rect x="334" y="60" width="130" height="84" class="box"/>
<text x="399" y="82" class="t">Sous-agent</text>
<text x="399" y="102" class="s">délégation chaînée</text>
<text x="399" y="117" class="s">IBCT (Biscuit, Datalog)</text>
<text x="399" y="132" class="s">échange de jetons RFC 8693</text>
<rect x="491" y="60" width="130" height="84" class="box"/>
<text x="556" y="82" class="t">Serveur MCP</text>
<text x="556" y="102" class="s">autorisation restreinte</text>
<text x="556" y="117" class="s">manifeste de permissions</text>
<text x="556" y="132" class="s">jetons liés (DPoP)</text>
<rect x="648" y="60" width="130" height="84" class="box"/>
<text x="713" y="82" class="t">API / système</text>
<text x="713" y="102" class="s">ABAC / OPA (Rego)</text>
<text x="713" y="117" class="s">rôle utilisateur ×</text>
<text x="713" y="132" class="s">identité de charge appelante</text>
<!-- flèches -->
<line x1="150" y1="102" x2="176" y2="102" class="ar"/>
<line x1="307" y1="102" x2="333" y2="102" class="ar"/>
<line x1="464" y1="102" x2="490" y2="102" class="ar"/>
<line x1="621" y1="102" x2="647" y2="102" class="ar"/>
<!-- atténuation -->
<text x="400" y="176" style="font-size:12px" text-anchor="middle">Atténuation : chaque saut porte le contexte d'autorisation de l'utilisateur d'origine, avec une portée réduite à chaque délégation [72], [74]–[76]</text>
<line x1="20" y1="188" x2="776" y2="188" class="ard"/>
<!-- bande transversale -->
<rect x="20" y="214" width="758" height="64" class="band"/>
<text x="399" y="238" style="font-size:12.5px;font-weight:700" text-anchor="middle">Transversal : identité distincte par agent · justificatifs éphémères · audit distinct · révocation entre protocoles</text>
<text x="399" y="260" class="s">action-centric identity [33] · Agent Naming Service et DID [73] · OIDC-A [78] · SAGA [80] · ABAC multi-locataires [79]</text>
</svg>
