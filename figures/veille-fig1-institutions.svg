<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="Consolidation institutionnelle des standards d'agents en septembre 2026">
<style>
:root{--ink:#1c1a17;--bg:#f9f7f7;--grey:#6b6459;--line:#ddd8d2;--card:#f0eeec;--blue:#1565c0;--wash:#e3ecf7}
@media (prefers-color-scheme:dark){:root{--ink:#f9f7f7;--bg:#282623;--grey:#b0aba6;--line:#453f39;--card:#32302c;--blue:#a5d6fe;--wash:#2f3a47}}
text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:12px}
.h{font-size:14px;font-weight:700}.t{font-size:12.5px;font-weight:700}.s{font-size:10.5px;fill:var(--grey)}
.outer{fill:none;stroke:var(--ink);stroke-width:1.2}
.box{fill:var(--card);stroke:var(--ink);stroke-width:1}
.chip{fill:var(--wash);stroke:var(--ink);stroke-width:1}
.ar{stroke:var(--ink);stroke-width:1.2;fill:none;marker-end:url(#m)}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker></defs>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<rect x="20" y="30" width="560" height="414" rx="8" class="outer"/>
<text x="36" y="52" class="h">Linux Foundation</text>
<!-- AAIF -->
<rect x="40" y="66" width="520" height="150" class="box"/>
<text x="56" y="88" class="t">Agentic AI Foundation (AAIF) — fondée le 9 décembre 2025</text>
<text x="56" y="104" class="s">membres platine : AWS, Anthropic, Block, Bloomberg, Cloudflare, Google, Microsoft, OpenAI</text>
<rect x="56" y="118" width="150" height="34" class="chip"/><text x="131" y="139" text-anchor="middle">MCP (Anthropic)</text>
<rect x="214" y="118" width="150" height="34" class="chip"/><text x="289" y="139" text-anchor="middle">goose (Block, avr. 2026)</text>
<rect x="372" y="118" width="170" height="34" class="chip"/><text x="457" y="139" text-anchor="middle">AGENTS.md (OpenAI)</text>
<rect x="56" y="164" width="230" height="34" class="chip"/><text x="171" y="185" text-anchor="middle">A2A — stade Growth, 27 août 2026</text>
<rect x="294" y="164" width="248" height="34" class="chip"/><text x="418" y="185" text-anchor="middle">agentgateway (Solo.io) — plan de données</text>
<!-- LF AI & Data -->
<rect x="40" y="236" width="250" height="84" class="box"/>
<text x="56" y="258" class="t">LF AI &amp; Data</text>
<text x="56" y="278" class="s">ACP (IBM, mars 2025), BeeAI</text>
<text x="56" y="294" class="s">fusionné dans A2A (août 2025)</text>
<line x1="250" y1="236" x2="250" y2="200" class="ar"/>
<!-- AGNTCY -->
<rect x="310" y="236" width="250" height="84" class="box"/>
<text x="326" y="258" class="t">AGNTCY (Cisco → LF, 29 juil. 2025)</text>
<text x="326" y="278" class="s">OASF · Agent Directory · identité vérifiable</text>
<text x="326" y="294" class="s">SLIM · observabilité · 65+ organisations</text>
<!-- x402 -->
<rect x="40" y="340" width="250" height="84" class="box"/>
<text x="56" y="362" class="t">x402 (Coinbase → LF, août 2026)</text>
<text x="56" y="382" class="s">≈ 40 membres : Visa, Mastercard, Stripe,</text>
<text x="56" y="398" class="s">Google, AWS, Cloudflare · paiements HTTP 402</text>
<!-- CNCF -->
<rect x="310" y="340" width="250" height="84" class="box"/>
<text x="326" y="362" class="t">CNCF</text>
<text x="326" y="382" class="s">agentregistry (Solo.io, mars 2026)</text>
<text x="326" y="398" class="s">découverte, empaquetage, distribution</text>
<!-- autres arènes -->
<rect x="600" y="66" width="180" height="110" class="box"/>
<text x="612" y="88" class="t">W3C</text>
<text x="612" y="108" class="s">AI Agent Protocol CG</text>
<text x="612" y="124" class="s">(8 mai 2025), 272 participants</text>
<text x="612" y="140" class="s">ANP : livre blanc (mai 2025),</text>
<text x="612" y="156" class="s">spécification (août 2025)</text>
<rect x="600" y="196" width="180" height="120" class="box"/>
<text x="612" y="218" class="t">NIST (CAISI, NCCoE)</text>
<text x="612" y="238" class="s">AI Agent Standards Initiative</text>
<text x="612" y="254" class="s">(17 févr. 2026)</text>
<text x="612" y="270" class="s">identité et autorisation des</text>
<text x="612" y="286" class="s">agents (févr. 2026); billet</text>
<text x="612" y="302" class="s">du 27 août 2026</text>
<rect x="600" y="336" width="180" height="108" class="box"/>
<text x="612" y="358" class="t">Union européenne</text>
<text x="612" y="378" class="s">AI Act, art. 50 : 2 août 2026</text>
<text x="612" y="394" class="s">haut risque : 2 déc. 2027</text>
<text x="612" y="410" class="s">et 2 août 2028</text>
<text x="612" y="426" class="s">code de pratique</text>
</svg>
