<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Deux modèles d'ouverture des éditeurs applicatifs aux agents tiers">
<style>
:root{--ink:#1c1a17;--bg:#f9f7f7;--grey:#6b6459;--line:#ddd8d2;--card:#f0eeec;--blue:#1565c0;--wash:#e3ecf7}
@media (prefers-color-scheme:dark){:root{--ink:#f9f7f7;--bg:#282623;--grey:#b0aba6;--line:#453f39;--card:#32302c;--blue:#a5d6fe;--wash:#2f3a47}}
text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:12px}
.h{font-size:13.5px;font-weight:700;text-anchor:middle}.t{font-size:12px;font-weight:700;text-anchor:middle}.s{font-size:10.5px;fill:var(--grey);text-anchor:middle}
.panel{fill:none;stroke:var(--line);stroke-width:1}
.box{fill:var(--card);stroke:var(--ink);stroke-width:1}
.alt{fill:var(--wash);stroke:var(--ink);stroke-width:1}
.miss{fill:none;stroke:var(--blue);stroke-width:1.4;stroke-dasharray:6 4}
.ar{stroke:var(--ink);stroke-width:1.2;fill:none;marker-end:url(#m)}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker></defs>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<!-- sans tête -->
<rect x="20" y="20" width="370" height="304" class="panel"/>
<text x="205" y="44" class="h">Modèle « sans tête » — ServiceNow, Salesforce</text>
<rect x="35" y="60" width="340" height="50" class="box"/>
<text x="205" y="80" class="t">Agent tiers</text>
<text x="205" y="97" class="s">Claude, Copilot, Bedrock, agent maison ou agent de programmation</text>
<line x1="205" y1="110" x2="205" y2="128" class="ar"/>
<rect x="35" y="130" width="340" height="60" class="alt"/>
<text x="205" y="150" class="t">Serveur MCP de l'éditeur</text>
<text x="205" y="166" class="s">OAuth · AI Control Tower · audit · quotas · outils par rôle</text>
<text x="205" y="180" class="s">ServiceNow : GA (mai 2026) · Salesforce : 60+ outils (avr. 2026)</text>
<line x1="205" y1="190" x2="205" y2="208" class="ar"/>
<rect x="35" y="210" width="340" height="60" class="box"/>
<text x="205" y="230" class="t">Actions et flux gouvernés</text>
<text x="205" y="246" class="s">déterministes, sans réinterprétation par un LLM</text>
<text x="205" y="260" class="s">une seule inférence : celle de l'agent appelant</text>
<text x="205" y="304" class="s">« Pourquoi devriez-vous encore vous connecter à Salesforce ? » [36]</text>
<!-- gardien -->
<rect x="410" y="20" width="370" height="304" class="panel"/>
<text x="595" y="44" class="h">Modèle « gardien » — SAP</text>
<rect x="425" y="60" width="340" height="50" class="box"/>
<text x="595" y="80" class="t">Agent tiers</text>
<text x="595" y="97" class="s">politique d'API v4/2026, § 2.2.2 : aucun appel d'API direct</text>
<line x1="595" y1="110" x2="595" y2="128" class="ar"/>
<rect x="425" y="130" width="340" height="60" class="alt"/>
<text x="595" y="150" class="t">A2A → Joule (inférence LLM obligatoire)</text>
<text x="595" y="166" class="s">« pour les cas agentiques, A2A via Joule est la seule voie »</text>
<text x="595" y="180" class="s">GA bidirectionnelle : T4 2026</text>
<line x1="595" y1="190" x2="595" y2="208" class="ar"/>
<rect x="425" y="210" width="340" height="60" class="box"/>
<text x="595" y="230" class="t">API et processus SAP</text>
<text x="595" y="246" class="s">deuxième inférence, puis exécution</text>
<text x="595" y="260" class="s">alternative payante : passerelle MCP Integration Suite (T2 2026)</text>
<rect x="425" y="278" width="340" height="40" class="miss"/>
<text x="595" y="294" class="s">double inférence · latence et coût doublés</text>
<text x="595" y="309" class="s">3 % des clients SAP avec Joule en production (DSAG) [38]</text>
</svg>
