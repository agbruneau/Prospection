<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Frise chronologique décembre 2025 à septembre 2026">
<style>
:root{--ink:#1c1a17;--bg:#f9f7f7;--grey:#6b6459;--line:#ddd8d2;--card:#f0eeec;--blue:#1565c0}
@media (prefers-color-scheme:dark){:root{--ink:#f9f7f7;--bg:#282623;--grey:#b0aba6;--line:#453f39;--card:#32302c;--blue:#a5d6fe}}
text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:11px;text-anchor:middle}
.d{font-weight:700;fill:var(--blue)}.m{font-size:11px;fill:var(--grey)}
.axis{stroke:var(--ink);stroke-width:1.5}
.tick{stroke:var(--ink);stroke-width:1}
.con{stroke:var(--grey);stroke-width:1}
.dot{fill:var(--blue)}
</style>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<line x1="40" y1="190" x2="770" y2="190" class="axis"/>
<!-- mois -->
<line x1="60" y1="186" x2="60" y2="194" class="tick"/><text x="60" y="212" class="m">déc. 2025</text>
<line x1="130" y1="186" x2="130" y2="194" class="tick"/><text x="130" y="212" class="m">janv.</text>
<line x1="200" y1="186" x2="200" y2="194" class="tick"/><text x="200" y="212" class="m">févr.</text>
<line x1="270" y1="186" x2="270" y2="194" class="tick"/><text x="270" y="212" class="m">mars</text>
<line x1="340" y1="186" x2="340" y2="194" class="tick"/><text x="340" y="212" class="m">avr.</text>
<line x1="410" y1="186" x2="410" y2="194" class="tick"/><text x="410" y="212" class="m">mai</text>
<line x1="480" y1="186" x2="480" y2="194" class="tick"/><text x="480" y="212" class="m">juin</text>
<line x1="550" y1="186" x2="550" y2="194" class="tick"/><text x="550" y="212" class="m">juil.</text>
<line x1="620" y1="186" x2="620" y2="194" class="tick"/><text x="620" y="212" class="m">août</text>
<line x1="690" y1="186" x2="690" y2="194" class="tick"/><text x="690" y="212" class="m">sept. 2026</text>
<!-- au-dessus, niveau 1 (y 62-90) -->
<circle cx="80" cy="190" r="3.5" class="dot"/><line x1="80" y1="186" x2="80" y2="100" class="con"/>
<text x="80" y="62" class="d">9 déc. 2025</text><text x="80" y="76">Agentic AI Foundation</text><text x="80" y="90">MCP, goose, AGENTS.md</text>
<circle cx="297" cy="190" r="3.5" class="dot"/><line x1="297" y1="186" x2="297" y2="100" class="con"/>
<text x="297" y="62" class="d">12 mars</text><text x="297" y="76">A2A 1.0</text><text x="297" y="90">première version stable</text>
<circle cx="438" cy="190" r="3.5" class="dot"/><line x1="438" y1="186" x2="438" y2="100" class="con"/>
<text x="438" y="62" class="d">12–13 mai</text><text x="438" y="76">SAP Sapphire</text><text x="438" y="90">Joule, A2A GA T4 2026</text>
<circle cx="618" cy="190" r="3.5" class="dot"/><line x1="618" y1="186" x2="618" y2="100" class="con"/>
<text x="618" y="62" class="d">28 juil. – 2 août</text><text x="618" y="76">spec MCP 2026-07-28</text><text x="618" y="90">Agents Classic; AI Act art. 50</text>
<!-- au-dessus, niveau 2 (y 112-140) -->
<circle cx="375" cy="190" r="3.5" class="dot"/><line x1="375" y1="186" x2="375" y2="150" class="con"/>
<text x="375" y="112" class="d">14–17 avr.</text><text x="375" y="126">Kong 3.14; Headless 360</text><text x="375" y="140">AWS Agent Registry</text>
<circle cx="500" cy="190" r="3.5" class="dot"/><line x1="500" y1="186" x2="500" y2="150" class="con"/>
<text x="500" y="112" class="d">9 juin</text><text x="500" y="126">Claude Fable 5</text><text x="500" y="140">et Mythos 5</text>
<circle cx="681" cy="190" r="3.5" class="dot"/><line x1="681" y1="186" x2="681" y2="150" class="con"/>
<text x="700" y="112" class="d">24–27 août</text><text x="700" y="126">Okta Agent SSO; MHS</text><text x="700" y="140">A2A rejoint l'AAIF</text>
<!-- en dessous, niveau 1 (y 248-276) -->
<circle cx="240" cy="190" r="3.5" class="dot"/><line x1="240" y1="194" x2="240" y2="238" class="con"/>
<text x="240" y="248" class="d">17 févr.</text><text x="240" y="262">NIST : initiative de</text><text x="240" y="276">normes d'agents</text>
<circle cx="420" cy="190" r="3.5" class="dot"/><line x1="420" y1="194" x2="420" y2="238" class="con"/>
<text x="420" y="248" class="d">5 mai</text><text x="420" y="262">Action Fabric;</text><text x="420" y="276">plan de contrôle watsonx</text>
<circle cx="570" cy="190" r="3.5" class="dot"/><line x1="570" y1="194" x2="570" y2="238" class="con"/>
<text x="570" y="248" class="d">9–13 juil.</text><text x="570" y="262">intrusion d'un agent</text><text x="570" y="276">chez Hugging Face</text>
<circle cx="695" cy="190" r="3.5" class="dot"/><line x1="695" y1="194" x2="695" y2="238" class="con"/>
<text x="695" y="248" class="d">1–3 sept.</text><text x="695" y="262">Fable 5.1, EFS;</text><text x="695" y="276">GPT-6 Astra</text>
<!-- en dessous, niveau 2 (y 300-328) -->
<circle cx="358" cy="190" r="3.5" class="dot"/><line x1="358" y1="194" x2="358" y2="290" class="con"/>
<text x="358" y="300" class="d">7–9 avr.</text><text x="358" y="314">goose → AAIF; Managed Agents</text><text x="358" y="328">A2A : 150+ organisations</text>
<circle cx="487" cy="190" r="3.5" class="dot"/><line x1="487" y1="194" x2="487" y2="290" class="con"/>
<text x="487" y="300" class="d">3 juin</text><text x="487" y="314">fin d'Agent Builder</text><text x="487" y="328">annoncée (OpenAI)</text>
<text x="40" y="350" class="m" style="text-anchor:start">Dates issues des sources citées au tableau 4; les événements sans jour précis (Build 2026, Loom, x402) ne sont pas placés.</text>
</svg>
