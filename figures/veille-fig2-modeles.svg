<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Orchestration interne aux fournisseurs : Claude Fable 5.1 et GPT-6 Astra">
<style>
:root{--ink:#1c1a17;--bg:#f9f7f7;--grey:#6b6459;--line:#ddd8d2;--card:#f0eeec;--blue:#1565c0;--wash:#e3ecf7}
@media (prefers-color-scheme:dark){:root{--ink:#f9f7f7;--bg:#282623;--grey:#b0aba6;--line:#453f39;--card:#32302c;--blue:#a5d6fe;--wash:#2f3a47}}
text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:12px}
.h{font-size:13.5px;font-weight:700;text-anchor:middle}.t{font-size:12px;font-weight:700;text-anchor:middle}.s{font-size:10.5px;fill:var(--grey);text-anchor:middle}
.panel{fill:none;stroke:var(--line);stroke-width:1}
.box{fill:var(--card);stroke:var(--ink);stroke-width:1}
.alt{fill:var(--wash);stroke:var(--ink);stroke-width:1}
.miss{fill:none;stroke:var(--blue);stroke-width:1.4;stroke-dasharray:6 4}
.ar{stroke:var(--ink);stroke-width:1.2;fill:none;marker-end:url(#m)}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker></defs>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<!-- Anthropic -->
<rect x="20" y="20" width="370" height="384" class="panel"/>
<text x="205" y="44" class="h">Anthropic — Claude Fable 5.1 (1er sept. 2026)</text>
<rect x="40" y="60" width="330" height="44" class="box"/>
<text x="205" y="80" class="t">Requête d'agent</text>
<text x="205" y="95" class="s">outils, serveurs MCP, usage d'ordinateur</text>
<line x1="205" y1="104" x2="205" y2="122" class="ar"/>
<rect x="40" y="124" width="330" height="56" class="box"/>
<text x="205" y="146" class="t">Classificateurs en temps réel</text>
<text x="205" y="163" class="s">cyber · biologie · vol de modèle · 60 % de faux positifs en moins</text>
<line x1="150" y1="180" x2="120" y2="208" class="ar"/>
<line x1="260" y1="180" x2="290" y2="208" class="ar"/>
<rect x="40" y="210" width="158" height="70" class="alt"/>
<text x="119" y="230" class="t">signalée →</text>
<text x="119" y="246" class="s">Opus 4.8 (cyber)</text>
<text x="119" y="259" class="s">Opus 5 (biologie)</text>
<text x="119" y="272" class="s">sans facturation</text>
<rect x="212" y="210" width="158" height="70" class="alt"/>
<text x="291" y="230" class="t">non signalée →</text>
<text x="291" y="246" class="s">Fable 5.1 (1 M de contexte)</text>
<text x="291" y="259" class="s">Mythos 5.1 : mêmes poids, sans</text>
<text x="291" y="272" class="s">réacheminement (Glasswing)</text>
<line x1="119" y1="280" x2="119" y2="296" class="ar"/>
<line x1="291" y1="280" x2="291" y2="296" class="ar"/>
<rect x="40" y="298" width="330" height="92" class="miss"/>
<text x="205" y="318" class="t">Contrat d'API et gouvernance des données</text>
<text x="205" y="334" class="s">blocs de pensée liés au modèle, perdus au changement de modèle</text>
<text x="205" y="348" class="s">historique en ajout seul · appel d'outil forcé retiré</text>
<text x="205" y="362" class="s">refus stop_reason · repli serveur (Opus 4.8 / Opus 5)</text>
<text x="205" y="376" class="s">EFS : surveillance dans le nuage du client, automne 2026</text>
<!-- OpenAI -->
<rect x="410" y="20" width="370" height="384" class="panel"/>
<text x="595" y="44" class="h">OpenAI — GPT-6 Astra (3 sept. 2026)</text>
<rect x="430" y="60" width="330" height="44" class="box"/>
<text x="595" y="80" class="t">Organisation</text>
<text x="595" y="95" class="s">identité et admissibilité vérifiées</text>
<line x1="595" y1="104" x2="595" y2="122" class="ar"/>
<rect x="430" y="124" width="330" height="56" class="alt"/>
<text x="595" y="146" class="t">Paliers d'accès</text>
<text x="595" y="163" class="s">Trusted Access · Daybreak Blue / Red · forfaits et API ensuite</text>
<line x1="595" y1="180" x2="595" y2="208" class="ar"/>
<rect x="430" y="210" width="330" height="70" class="box"/>
<text x="595" y="230" class="t">GPT-6 Astra — seuil cyber « Critical »</text>
<text x="595" y="246" class="s">1 050 000 jetons · effort xhigh / max · sans affinage</text>
<text x="595" y="259" class="s">surveillance des inférences externes avec outils</text>
<text x="595" y="272" class="s">issues désalignées : 3,4 % (18,8 % pour GPT-5.6 Sol)</text>
<line x1="595" y1="280" x2="595" y2="296" class="ar"/>
<rect x="430" y="298" width="330" height="92" class="miss"/>
<text x="595" y="318" class="t">Substrat d'outils et observabilité</text>
<text x="595" y="334" class="s">MCP distant : OAuth, allowed_tools, approbation par défaut</text>
<text x="595" y="348" class="s">connecteurs · Secure MCP Tunnel (HTTPS sortant seul)</text>
<text x="595" y="362" class="s">recherche d'outils · compétences · shell hébergé</text>
<text x="595" y="376" class="s">raisonnement « substantiellement » moins surveillable</text>
</svg>
