<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Meilleurs résultats déclarés sur les bancs d'essai fondés sur des serveurs MCP">
<style>
:root{--ink:#1c1a17;--bg:#f9f7f7;--grey:#6b6459;--line:#ddd8d2;--card:#f0eeec;--blue:#1565c0}
@media (prefers-color-scheme:dark){:root{--ink:#f9f7f7;--bg:#282623;--grey:#b0aba6;--line:#453f39;--card:#32302c;--blue:#a5d6fe}}
text{font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink);font-size:12px}
.s{font-size:11px;fill:var(--grey)}.v{font-size:12px;font-weight:700}
.grid{stroke:var(--line);stroke-width:1}
.axis{stroke:var(--ink);stroke-width:1}
.bar{fill:var(--blue)}
.bound{fill:none;stroke:var(--blue);stroke-width:1.4;stroke-dasharray:6 4}
</style>
<rect width="100%" height="100%" style="fill:var(--bg)"/>
<text x="280" y="24" style="font-size:13px;font-weight:700">Taux de réussite le plus élevé rapporté par les auteurs (%)</text>
<!-- grille -->
<line x1="280" y1="36" x2="280" y2="252" class="axis"/>
<line x1="395" y1="36" x2="395" y2="252" class="grid"/>
<line x1="510" y1="36" x2="510" y2="252" class="grid"/>
<line x1="625" y1="36" x2="625" y2="252" class="grid"/>
<line x1="740" y1="36" x2="740" y2="252" class="grid"/>
<text x="280" y="268" class="s" text-anchor="middle">0</text>
<text x="395" y="268" class="s" text-anchor="middle">25</text>
<text x="510" y="268" class="s" text-anchor="middle">50</text>
<text x="625" y="268" class="s" text-anchor="middle">75</text>
<text x="740" y="268" class="s" text-anchor="middle">100</text>
<!-- MCP-Atlas 82,2 -->
<rect x="280" y="46" width="378" height="26" class="bar"/>
<text x="270" y="58" text-anchor="end">MCP-Atlas · 20 modèles</text>
<text x="270" y="71" class="s" text-anchor="end">seuil de couverture 0,75 [59]</text>
<text x="664" y="64" class="v">82,2</text>
<!-- LiveMCPBench 78,95 -->
<rect x="280" y="91" width="363" height="26" class="bar"/>
<text x="270" y="103" text-anchor="end">LiveMCPBench · Claude-Sonnet-4</text>
<text x="270" y="116" class="s" text-anchor="end">la plupart des modèles : 30 à 50 [54]</text>
<text x="649" y="109" class="v">78,95</text>
<!-- LiveMCP-101 < 60 -->
<rect x="280" y="136" width="276" height="26" class="bound"/>
<text x="270" y="148" text-anchor="end">LiveMCP-101 · modèles de pointe</text>
<text x="270" y="161" class="s" text-anchor="end">borne supérieure rapportée [56]</text>
<text x="562" y="154" class="v">&lt; 60</text>
<!-- MCPMark 52,56 -->
<rect x="280" y="181" width="242" height="26" class="bar"/>
<text x="270" y="193" text-anchor="end">MCPMark · pass@1</text>
<text x="270" y="206" class="s" text-anchor="end">pass^4 : 33,86 [55]</text>
<text x="528" y="199" class="v">52,56</text>
<!-- MCP-Universe 43,72 -->
<rect x="280" y="226" width="201" height="26" class="bar"/>
<text x="270" y="238" text-anchor="end">MCP-Universe · GPT-5</text>
<text x="270" y="251" class="s" text-anchor="end">Claude-4.0-Sonnet : 29,44 [53]</text>
<text x="487" y="244" class="v">43,72</text>
<text x="20" y="288" class="s">Pointillé : borne supérieure, non mesure. Métriques propres à chaque banc (rubrique par affirmations, pass@1, juge LLM) : barres non comparables.</text>
</svg>
