<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 515" width="880" height="515">
  <defs>
    <marker id="arrNavy30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f2744"/>
    </marker>
    <marker id="arrBlue30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrAmber30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9a3412"/>
    </marker>
    <marker id="arrGreen30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
  </defs>

  <rect width="880" height="515" fill="#ffffff"/>

  <text x="440" y="25" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" font-weight="bold" fill="#0f2744">Agentic DataOps &amp; SRE Autonome : Gardiens de Data Contracts, Quarantaine et Remédiation sous Cedar</text>

  <!-- Moitié Gauche : Agentic DataOps -->
  <rect x="20" y="46" width="408" height="312" rx="7" fill="#f0f5fa" stroke="#1d4ed8" stroke-width="1.6"/>
  <rect x="20" y="46" width="408" height="28" rx="7" fill="#1d4ed8"/>
  <text x="224" y="65" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">Couloir 1 — Agentic DataOps &amp; Contrats de Données</text>

  <rect x="38" y="88" width="372" height="68" rx="5" fill="#ffffff" stroke="#0f2744" stroke-width="1.2"/>
  <text x="224" y="106" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#0f2744">1. Détection de Rupture Amont (CDC / Kafka / Iceberg)</text>
  <text x="224" y="123" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Changement de schéma, dérive d'unité (bar/kPa, °F/°C), nulls</text>
  <text x="224" y="139" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#9a3412">Blocage immédiat avant pollution de la couche Or &amp; RAG</text>

  <line x1="224" y1="156" x2="224" y2="176" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrBlue30)"/>

  <rect x="38" y="178" width="372" height="74" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="224" y="196" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#1d4ed8">2. Agent Gardien Sémantique &amp; Lignée (OpenLineage)</text>
  <text x="224" y="213" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">Croise commit Git producteur + ontologie Apache Ossie</text>
  <text x="224" y="229" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">Dérive bénigne (renommage) → génère PR dbt/Spark testée</text>
  <text x="224" y="244" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" font-weight="bold" fill="#0f5132">Dérive sémantique grave → isolement en branche WAP</text>

  <line x1="224" y1="252" x2="224" y2="272" stroke="#0f5132" stroke-width="1.5" marker-end="url(#arrGreen30)"/>

  <rect x="38" y="274" width="372" height="68" rx="5" fill="#ecfdf5" stroke="#0f5132" stroke-width="1.2"/>
  <text x="224" y="292" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#0f5132">3. Protection de la Flotte Aval (Write-Audit-Publish)</text>
  <text x="224" y="309" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#1e293b">Publication atomique uniquement après validation contrat</text>
  <text x="224" y="325" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" font-weight="bold" fill="#0f5132">Zéro empoisonnement silencieux des agents métiers (ASI06)</text>

  <!-- Moitié Droite : SRE Autonome Borné -->
  <rect x="452" y="46" width="408" height="312" rx="7" fill="#f6f3ff" stroke="#4c1d95" stroke-width="1.6"/>
  <rect x="452" y="46" width="408" height="28" rx="7" fill="#4c1d95"/>
  <text x="656" y="65" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">Couloir 2 — SRE Autonome Borné (Incident → Remédiation)</text>

  <rect x="470" y="88" width="372" height="68" rx="5" fill="#ffffff" stroke="#0f2744" stroke-width="1.2"/>
  <text x="656" y="106" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#0f2744">1. Corrélation Causale OpenTelemetry (Traces + Logs)</text>
  <text x="656" y="123" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">Déduplication tempête d'alertes via graphe de topologie</text>
  <text x="656" y="139" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#4c1d95">Ouverture d'une enquête en lecture seule stricte (L1)</text>

  <line x1="656" y1="156" x2="656" y2="176" stroke="#4c1d95" stroke-width="1.5" marker-end="url(#arrNavy30)"/>

  <rect x="470" y="178" width="372" height="74" rx="5" fill="#ffffff" stroke="#4c1d95" stroke-width="1.2"/>
  <text x="656" y="196" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#4c1d95">2. Essaim d'Hypothèses Concurrentes (Lecture Seule)</text>
  <text x="656" y="213" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">Agent Réseau • Agent DB/Locks • Agent Déploiement récent</text>
  <text x="656" y="229" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">Réfutation factuelle par requêtes PromQL / eBPF / Git</text>
  <text x="656" y="244" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" font-weight="bold" fill="#0f2744">Sélection d'un Runbook paramétré pré-homologué</text>

  <line x1="656" y1="252" x2="656" y2="272" stroke="#9a3412" stroke-width="1.5" marker-end="url(#arrAmber30)"/>

  <rect x="470" y="274" width="372" height="68" rx="5" fill="#fff7ed" stroke="#9a3412" stroke-width="1.2"/>
  <text x="656" y="292" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#9a3412">3. Exécution sous Garde-Fou Cedar (Zéro Shell Libre)</text>
  <text x="656" y="309" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">Actions bornées : rollback Canary, drain pod, purge cache</text>
  <text x="656" y="325" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" font-weight="bold" fill="#991b1b">Actions destructives (DROP, IAM) : CIBA humain requis</text>

  <!-- Lien transversal DataOps <-> SRE -->
  <line x1="428" y1="215" x2="452" y2="215" stroke="#0f2744" stroke-width="1.6" marker-start="url(#arrNavy30)" marker-end="url(#arrNavy30)"/>

  <!-- Bandeau Inférieur : Matrice de Rayon d'Impact (Blast Radius) -->
  <rect x="20" y="378" width="840" height="118" rx="7" fill="#f8fafc" stroke="#0f2744" stroke-width="1.4"/>
  <text x="440" y="398" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.8" font-weight="bold" fill="#0f2744">Gouvernance par Rayon d'Impact (Blast Radius) &amp; Boucle Post-Mortem Automatisée</text>

  <rect x="38" y="412" width="250" height="68" rx="4" fill="#ffffff" stroke="#0f5132"/>
  <text x="163" y="430" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" font-weight="bold" fill="#0f5132">Palier R1 — Réversible Local (L3)</text>
  <text x="163" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Redémarrage pod isolé, quarantaine WAP</text>
  <text x="163" y="462" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#0f5132">Exécution immédiate + notification SRE</text>

  <rect x="315" y="412" width="250" height="68" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="440" y="430" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" font-weight="bold" fill="#1d4ed8">Palier R2 — Service Régional (L3/L2)</text>
  <text x="440" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Rollback release N-1, bascule trafic</text>
  <text x="440" y="462" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#1d4ed8">Budget max 1 action / 30 min par cluster</text>

  <rect x="592" y="412" width="250" height="68" rx="4" fill="#ffffff" stroke="#b91c1c"/>
  <text x="717" y="430" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" font-weight="bold" fill="#b91c1c">Palier R3 — État Persistant (L2 CIBA)</text>
  <text x="717" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Migration schéma DB, rejeu massif Kafka</text>
  <text x="717" y="462" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#b91c1c">Double signature humaine obligatoire</text>
</svg>
