<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460">
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
  </defs>

  <rect width="880" height="460" fill="#ffffff"/>

  <text x="440" y="26" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="bold" fill="#0f2744">Pipeline Industriel de Context Engineering : Du Flux Brut au Handoff Sans Context Rot</text>

  <!-- Étape 1 : Sources brutes -->
  <rect x="18" y="46" width="166" height="278" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="101" y="68" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#334155">1. Sources Hétérogènes</text>

  <rect x="30" y="82" width="142" height="50" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="101" y="102" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Corpus Documentaire</text>
  <text x="101" y="118" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#64748b">Index Dense + BM25</text>

  <rect x="30" y="144" width="142" height="50" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="101" y="164" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Sorties d'Outils MCP</text>
  <text x="101" y="180" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#64748b">JSON / Logs Télématiques</text>

  <rect x="30" y="206" width="142" height="50" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="101" y="226" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Mémoire &amp; Ontologie</text>
  <text x="101" y="242" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#64748b">Faits Ossie &amp; Graphiti</text>

  <rect x="30" y="268" width="142" height="44" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="101" y="287" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#991b1b">Risque brut : 150k+ tok</text>
  <text x="101" y="302" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#7f1d1d">Bruit, PII &amp; ASI01</text>

  <line x1="184" y1="185" x2="212" y2="185" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arrowDark)"/>

  <!-- Étape 2 : Filtrage ACL-aware & Lignée -->
  <rect x="212" y="46" width="194" height="278" rx="6" fill="#fff7ed" stroke="#9a3412" stroke-width="1.4"/>
  <text x="309" y="68" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#7c2d12">2. Garde ACL &amp; Hygiène</text>

  <rect x="224" y="84" width="170" height="64" rx="4" fill="#ffffff" stroke="#9a3412"/>
  <text x="309" y="104" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#7c2d12">Filtre Pré-Récupération</text>
  <text x="309" y="120" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Portée OAuth 2.1 OBO</text>
  <text x="309" y="134" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Prédicats Cedar / ABAC</text>

  <rect x="224" y="160" width="170" height="64" rx="4" fill="#ffffff" stroke="#9a3412"/>
  <text x="309" y="180" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#7c2d12">Assainissement &amp; Caviardage</text>
  <text x="309" y="196" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Masquage PII (Loi 25)</text>
  <text x="309" y="210" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Isolation balises données</text>

  <rect x="224" y="236" width="170" height="74" rx="4" fill="#ffffff" stroke="#1e3a5f"/>
  <text x="309" y="256" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f2744">Scellement de Lignée</text>
  <text x="309" y="272" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">URI source + SHA-256</text>
  <text x="309" y="286" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Score Reranker &amp; Fraîcheur</text>
  <text x="309" y="300" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1d4ed8">Rejet si score &lt; seuil</text>

  <line x1="406" y1="185" x2="434" y2="185" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <!-- Étape 3 : Compilateur de Fenêtre & Budget d'Attention -->
  <rect x="434" y="46" width="224" height="278" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="546" y="68" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#0f2744">3. Fenêtre Compilée (Budget Fixe)</text>

  <rect x="448" y="82" width="196" height="50" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="546" y="101" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">Strate 0 : Préfixe Immuable</text>
  <text x="546" y="117" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1e3a5f">Règles + Outils (&lt;12) • KV-Cache Hit</text>

  <rect x="448" y="140" width="196" height="48" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="546" y="159" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">Strate 1 : Cadre Sémantique</text>
  <text x="546" y="175" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Définitions Ossie + État Saga</text>

  <rect x="448" y="196" width="196" height="54" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="546" y="215" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">Strate 2 : Preuves Compressées</text>
  <text x="546" y="230" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Tri Tête/Queue (Anti-Creux Médian)</text>
  <text x="546" y="243" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1d4ed8">Plafond dur : ex. 8 192 jetons</text>

  <rect x="448" y="258" width="196" height="52" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.3"/>
  <text x="546" y="277" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f5132">Strate 3 : Objectif Courant</text>
  <text x="546" y="293" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Instruction locale + Schéma sortie</text>

  <line x1="658" y1="185" x2="686" y2="185" stroke="#0f5132" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <!-- Étape 4 : Handoff inter-agents sans Context Rot -->
  <rect x="686" y="46" width="176" height="278" rx="6" fill="#ecfdf5" stroke="#0f5132" stroke-width="1.5"/>
  <text x="774" y="68" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#0f5132">4. Transfert A2A Propre</text>

  <rect x="698" y="84" width="152" height="68" rx="4" fill="#ffffff" stroke="#0f5132"/>
  <text x="774" y="104" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f5132">Cellule Agentique</text>
  <text x="774" y="120" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Raisonnement haute densité</text>
  <text x="774" y="135" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#0f5132">TTFT minimal • Précision max</text>

  <line x1="774" y1="152" x2="774" y2="176" stroke="#0f5132" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="698" y="176" width="152" height="134" rx="4" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="774" y="196" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">Enveloppe de Handoff</text>
  <text x="774" y="214" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Décisions &amp; Faits typés</text>
  <text x="774" y="229" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Hypothèses écartées</text>
  <text x="774" y="244" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Pointeurs URI (Claim-Check)</text>
  <text x="774" y="259" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Incertitudes résiduelles</text>
  <text x="774" y="280" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#991b1b">Zéro historique brut copié</text>
  <text x="774" y="296" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#0f5132">Élimine le Context Rot</text>

  <!-- Bandeau inférieur : Boucle de télémétrie et Stockage d'artefacts par référence -->
  <rect x="18" y="344" width="844" height="98" rx="6" fill="#f8fafc" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="440" y="366" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#0f2744">Plan Sous-Jacent : Stockage par Référence (Claim-Check) &amp; Observabilité du Budget d'Attention</text>

  <rect x="36" y="378" width="256" height="50" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="164" y="397" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#1e293b">Magasin d'Artefacts Immuables (CAS)</text>
  <text x="164" y="413" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">Stocke journaux complets &amp; PDF hors prompt</text>

  <rect x="312" y="378" width="256" height="50" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="440" y="397" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">Affinité de Cache Préfixe (Tenant-Salted)</text>
  <text x="440" y="413" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1d4ed8">70 % à 88 % d'économie sur jetons d'entrée</text>

  <rect x="588" y="378" width="256" height="50" rx="4" fill="#ffffff" stroke="#0f5132"/>
  <text x="716" y="397" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f5132">Métriques OpenTelemetry (gen_ai.context.*)</text>
  <text x="716" y="413" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Ratio Signal/Bruit • Taux Cache Hit • Troncatures</text>
</svg>
