<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c2410c"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="880" height="460" fill="#ffffff"/>
  <text x="440" y="25" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14.8" font-weight="bold" fill="#0f2744">Cycle de Vie d'une Tâche Asynchrone A2A v1.0 : Découverte, Machine à États et Double Canal</text>

  <!-- Bandeau supérieur : Découverte et Soumission -->
  <rect x="24" y="40" width="832" height="90" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="40" y="60" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">Phases 1 &amp; 2 — Découverte Authentifiée de l'Agent Card et Soumission de Tâche Enveloppée</text>

  <rect x="40" y="70" width="226" height="48" rx="4" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="153" y="90" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">Agent Client / Orchestrateur</text>
  <text x="153" y="107" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#475569">Workflow Temporal • Identité SPIFFE</text>

  <line x1="266" y1="94" x2="310" y2="94" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#arrDark)"/>

  <rect x="310" y="70" width="256" height="48" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="438" y="90" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.3" font-weight="bold" fill="#1d4ed8">1. GET /.well-known/agent-card.json</text>
  <text x="438" y="107" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">Vérification signature JWS &amp; schémas I/O</text>

  <line x1="566" y1="94" x2="610" y2="94" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrBlue)"/>

  <rect x="610" y="70" width="230" height="48" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.3"/>
  <text x="725" y="90" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.3" font-weight="bold" fill="#0f5132">2. POST message/send | stream</text>
  <text x="725" y="107" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">JSON-RPC 2.0 + Jeton OAuth 2.1 OBO</text>

  <!-- Zone centrale : Machine à états A2A v1.0 -->
  <rect x="24" y="144" width="832" height="190" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="40" y="165" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">Phase 3 — Machine à États Normative de l'Objet Task (Corrélation contextId &amp; taskId)</text>

  <!-- État submitted -->
  <rect x="40" y="190" width="132" height="58" rx="4" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="106" y="213" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.8" font-weight="bold" fill="#0f2744">submitted</text>
  <text x="106" y="230" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#475569">Quotas &amp; idempotence</text>
  <text x="106" y="242" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#475569">validés en passerelle</text>

  <line x1="172" y1="219" x2="218" y2="219" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrBlue)"/>

  <!-- État working -->
  <rect x="218" y="184" width="176" height="70" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="306" y="206" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">working</text>
  <text x="306" y="223" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">Inférence spécialiste active</text>
  <text x="306" y="238" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">Appels verticaux outils MCP</text>

  <!-- Boucle input-required / auth-required -->
  <path d="M 275 254 L 275 292 L 328 292" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrAmber)"/>
  <rect x="328" y="264" width="248" height="58" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
  <text x="452" y="284" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#9a3412">input-required | auth-required</text>
  <text x="452" y="300" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#7c2d12">Suspension sans CPU : demande pièce manquante</text>
  <text x="452" y="313" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#7c2d12">ou consentement hors bande (CIBA / OBO)</text>
  <path d="M 452 264 L 452 240 L 394 240" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrBlue)"/>
  <text x="478" y="253" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#1d4ed8">Reprise message/send (taskId)</text>

  <!-- Flèches vers états terminaux -->
  <path d="M 394 202 L 606 196" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrGreen)"/>
  <path d="M 394 224 L 580 224 L 580 284 L 606 284" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <!-- État completed -->
  <rect x="606" y="166" width="234" height="62" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="723" y="186" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.6" font-weight="bold" fill="#14532d">completed (État Terminal)</text>
  <text x="723" y="203" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#166534">Livraison d'Artifact typé immuable :</text>
  <text x="723" y="217" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">DataPart (JSON) • FilePart (URI) • TextPart</text>

  <!-- États d'arrêt négatifs -->
  <rect x="606" y="254" width="234" height="62" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="723" y="274" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.4" font-weight="bold" fill="#991b1b">failed | canceled | rejected</text>
  <text x="723" y="291" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#7f1d1d">Diagnostic normalisé JSON-RPC &amp; déclenchement</text>
  <text x="723" y="305" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#7f1d1d">de la compensation Saga côté orchestrateur</text>

  <!-- Bandeau inférieur : Double canal de transport retour -->
  <rect x="24" y="348" width="406" height="96" rx="5" fill="#f0fdf4" stroke="#0f5132" stroke-width="1.3"/>
  <text x="40" y="369" font-family="Segoe UI, Calibri, sans-serif" font-size="10.8" font-weight="bold" fill="#0f5132">Canal A — Streaming SSE (Régime T2 : 2 s à 3 min)</text>
  <text x="40" y="388" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">• Flux ouvert via message/stream ou tasks/resubscribe</text>
  <text x="40" y="405" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">• Événements temps réel : TaskStatusUpdateEvent</text>
  <text x="40" y="422" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">• Fragments d'artefacts : TaskArtifactUpdateEvent (lastChunk)</text>

  <rect x="450" y="348" width="406" height="96" rx="5" fill="#fff7ed" stroke="#9a3412" stroke-width="1.3"/>
  <text x="466" y="369" font-family="Segoe UI, Calibri, sans-serif" font-size="10.8" font-weight="bold" fill="#7c2d12">Canal B — Push Webhooks Signés (Régimes T3–T4 : &gt; 3 min)</text>
  <text x="466" y="388" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">• Enregistré via pushNotificationConfig (zéro polling actif)</text>
  <text x="466" y="405" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">• Rappel HTTPS sortant vers l'awakeable Temporal / Restate</text>
  <text x="466" y="422" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">• Vérification cryptographique : JWS / HMAC + anti-rejeu</text>
</svg>
