<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="#ffffff"/>

  <!-- Titre principal -->
  <text x="440" y="26" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14.5" font-weight="bold" fill="#0f2744">Écosystème Institutionnel 2026–2027 et Modèle de Référence en 6 Couches (OSI / Agentique)</text>

  <!-- PANNEAU GAUCHE : Pile en 6 couches -->
  <rect x="22" y="42" width="474" height="482" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="259" y="63" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12" font-weight="bold" fill="#0f2744">Pile Protocolaire d'Entreprise (Correspondance OSI)</text>

  <!-- Couche 6 -->
  <rect x="32" y="76" width="454" height="64" rx="5" fill="#ffffff" stroke="#991b1b" stroke-width="1.4"/>
  <rect x="32" y="76" width="102" height="64" rx="5" fill="#fef2f2" stroke="#991b1b" stroke-width="1.4"/>
  <text x="83" y="103" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">Couche 6</text>
  <text x="83" y="121" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#7f1d1d">OSI L7 (UI &amp; Tx)</text>
  <text x="144" y="96" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">Interaction Humaine, Navigateur &amp; Commerce</text>
  <text x="144" y="113" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Flux réactifs AG-UI, interfaces A2UI / MCP-UI, voix temps réel WebRTC</text>
  <text x="144" y="129" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Outils client WebMCP (W3C) • Mandats AP2 (FIDO) &amp; règlement HTTP x402</text>

  <!-- Couche 5 -->
  <rect x="32" y="148" width="454" height="64" rx="5" fill="#ffffff" stroke="#0f5132" stroke-width="1.4"/>
  <rect x="32" y="148" width="102" height="64" rx="5" fill="#f0fdf4" stroke="#0f5132" stroke-width="1.4"/>
  <text x="83" y="175" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f5132">Couche 5</text>
  <text x="83" y="193" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#14532d">OSI L7 (Maillage)</text>
  <text x="144" y="168" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">Coordination Horizontale &amp; Découverte Inter-Agents</text>
  <text x="144" y="185" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Délégation entre pairs autonomes : A2A v1.0 (convergence ACP, Agent Cards)</text>
  <text x="144" y="201" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Annuaire fédéré AGNTCY (OASF, Agent Directory) &amp; traversée B2B (ANP)</text>

  <!-- Couche 4 -->
  <rect x="32" y="220" width="454" height="64" rx="5" fill="#ffffff" stroke="#5b21b6" stroke-width="1.4"/>
  <rect x="32" y="220" width="102" height="64" rx="5" fill="#f5f3ff" stroke="#5b21b6" stroke-width="1.4"/>
  <text x="83" y="247" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#5b21b6">Couche 4</text>
  <text x="83" y="265" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#4c1d95">OSI L6 (Présentation)</text>
  <text x="144" y="240" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">Sémantique Métier &amp; Portabilité Cognitive</text>
  <text x="144" y="257" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Ontologies canoniques d'entreprise : Apache Ossie (JSON Schema / RDF)</text>
  <text x="144" y="273" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Savoir-faire portable : Agent Skills (SKILL.md), AGENTS.md, Open Responses</text>

  <!-- Couche 3 -->
  <rect x="32" y="292" width="454" height="64" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <rect x="32" y="292" width="102" height="64" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="83" y="319" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8">Couche 3</text>
  <text x="83" y="337" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#1e3a8a">OSI L5–L6 (Session)</text>
  <text x="144" y="312" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">Connectivité Verticale &amp; Accès Outillé aux Systèmes</text>
  <text x="144" y="329" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Model Context Protocol (MCP) sur JSON-RPC 2.0 &amp; Streamable HTTP</text>
  <text x="144" y="345" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Primitives : Tools, Resources, Prompts, Roots, Sampling, Elicitation</text>

  <!-- Couche 2 -->
  <rect x="32" y="364" width="454" height="64" rx="5" fill="#ffffff" stroke="#92400e" stroke-width="1.4"/>
  <rect x="32" y="364" width="102" height="64" rx="5" fill="#fffbeb" stroke="#92400e" stroke-width="1.4"/>
  <text x="83" y="391" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">Couche 2</text>
  <text x="83" y="409" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#78350f">OSI L4–L5 (Transport)</text>
  <text x="144" y="384" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">Plan de Données IA, Routage &amp; Identité Cryptographique</text>
  <text x="144" y="401" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Proxy agentgateway, Agent Router, transport SLIM chiffré MLS (RFC 9420)</text>
  <text x="144" y="417" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Identités NHI (SPIFFE/WIMSE), délégation OAuth 2.1 OBO (RFC 8693) &amp; Cedar</text>

  <!-- Couche 1 -->
  <rect x="32" y="436" width="454" height="74" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
  <rect x="32" y="436" width="102" height="74" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="1.4"/>
  <text x="83" y="467" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">Couche 1</text>
  <text x="83" y="485" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">OSI L1–L3 (Infra)</text>
  <text x="144" y="456" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">Isolation d'Exécution, Évaluation &amp; Moteurs Durables</text>
  <text x="144" y="473" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Bacs à sable microVM / WASM : OpenSandbox • Bancs d'essai RL : OpenEnv</text>
  <text x="144" y="489" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Hôte agentique de référence Goose • Orchestration durable (Temporal / Restate)</text>
  <text x="144" y="503" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#64748b">• Télémétrie transversale : OpenTelemetry (conventions sémantiques gen_ai.*)</text>

  <!-- Connecteurs de normalisation (Droite vers Gauche) -->
  <line x1="524" y1="180" x2="498" y2="180" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrBlue)"/>
  <line x1="524" y1="316" x2="498" y2="188" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrSlate)"/>
  <line x1="524" y1="374" x2="498" y2="252" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrSlate)"/>
  <line x1="524" y1="432" x2="498" y2="396" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrSlate)"/>
  <line x1="524" y1="488" x2="498" y2="112" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrSlate)"/>

  <!-- PANNEAU DROIT : Gouvernance institutionnelle -->
  <rect x="524" y="42" width="334" height="482" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="691" y="63" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="12" font-weight="bold" fill="#0f2744">Autorités de Gouvernance Ouverte</text>

  <!-- Bloc AAIF (10 projets) -->
  <rect x="536" y="76" width="310" height="206" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="691" y="95" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#0f2744">Linux Foundation — AAIF (10 Projets)</text>
  <text x="691" y="109" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1e40af">Agentic AI Foundation (Socle neutre inter-éditeurs)</text>

  <!-- Colonne gauche des 5 projets AAIF -->
  <rect x="545" y="117" width="142" height="27" rx="3" fill="#ffffff" stroke="#93c5fd"/>
  <text x="616" y="134" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">1. MCP (C3 Vertical)</text>

  <rect x="545" y="149" width="142" height="27" rx="3" fill="#ffffff" stroke="#93c5fd"/>
  <text x="616" y="166" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">2. A2A v1.0 (C5 Pairs)</text>

  <rect x="545" y="181" width="142" height="27" rx="3" fill="#ffffff" stroke="#93c5fd"/>
  <text x="616" y="198" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">3. AGENTS.md (C4 Dépôts)</text>

  <rect x="545" y="213" width="142" height="27" rx="3" fill="#ffffff" stroke="#93c5fd"/>
  <text x="616" y="230" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">4. Goose (C1 Hôte Réf.)</text>

  <rect x="545" y="245" width="142" height="27" rx="3" fill="#ffffff" stroke="#93c5fd"/>
  <text x="616" y="262" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">5. Agent Router (C2)</text>

  <!-- Colonne droite des 5 projets AAIF -->
  <rect x="695" y="117" width="142" height="27" rx="3" fill="#ffffff" stroke="#93c5fd"/>
  <text x="766" y="134" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">6. agentgateway (C2)</text>

  <rect x="695" y="149" width="142" height="27" rx="3" fill="#ffffff" stroke="#93c5fd"/>
  <text x="766" y="166" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">7. Agent Skills (C4)</text>

  <rect x="695" y="181" width="142" height="27" rx="3" fill="#ffffff" stroke="#93c5fd"/>
  <text x="766" y="198" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">8. Open Responses (C4)</text>

  <rect x="695" y="213" width="142" height="27" rx="3" fill="#ffffff" stroke="#93c5fd"/>
  <text x="766" y="230" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">9. OpenEnv (C1 Éval.)</text>

  <rect x="695" y="245" width="142" height="27" rx="3" fill="#ffffff" stroke="#93c5fd"/>
  <text x="766" y="262" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">10. OpenSandbox (C1)</text>

  <!-- Bloc AGNTCY -->
  <rect x="536" y="291" width="310" height="50" rx="5" fill="#f0fdf4" stroke="#0f5132" stroke-width="1.3"/>
  <text x="691" y="310" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.3" font-weight="bold" fill="#0f5132">Linux Foundation — AGNTCY</text>
  <text x="691" y="328" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Taxonomie OASF • Agent Directory (DHT/OCI) • Messagerie SLIM</text>

  <!-- Bloc ASF -->
  <rect x="536" y="349" width="310" height="50" rx="5" fill="#f5f3ff" stroke="#5b21b6" stroke-width="1.3"/>
  <text x="691" y="368" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.3" font-weight="bold" fill="#5b21b6">Apache Software Foundation (ASF)</text>
  <text x="691" y="386" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Apache Ossie (Ontologies métiers &amp; contrats JSON canoniques)</text>

  <!-- Bloc IETF -->
  <rect x="536" y="407" width="310" height="50" rx="5" fill="#fffbeb" stroke="#92400e" stroke-width="1.3"/>
  <text x="691" y="426" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.3" font-weight="bold" fill="#92400e">IETF (Sécurité, Identité &amp; Chiffrement)</text>
  <text x="691" y="444" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">OAuth 2.1 • RFC 8693 (OBO) • RFC 9449 (DPoP) • MLS • WIMSE</text>

  <!-- Bloc W3C & FIDO -->
  <rect x="536" y="465" width="310" height="48" rx="5" fill="#fef2f2" stroke="#991b1b" stroke-width="1.3"/>
  <text x="691" y="483" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.3" font-weight="bold" fill="#991b1b">W3C &amp; Alliance FIDO</text>
  <text x="691" y="500" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">WebMCP navigateur • DID &amp; VC 2.0 • Mandats de paiement AP2</text>
</svg>
