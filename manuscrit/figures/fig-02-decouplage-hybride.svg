  <text x="312" y="295" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">• Plafond dur jetons raisonnement &amp; budget CAD</text>
  <text x="312" y="311" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#64748b">• Décodage contraint par grammaire (CFG)</text>

