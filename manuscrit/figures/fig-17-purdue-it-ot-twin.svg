<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 545" width="880" height="545">
  <defs>
    <marker id="arrUp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
    <marker id="arrStop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#991b1b"/>
    </marker>
  </defs>
  <rect width="880" height="545" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14.2" font-weight="bold" fill="#0f2744">Convergence IT/OT (IEC 62443 / Modèle Purdue) : Lecture OPC-UA et Sas par Jumeau Numérique</text>

  <!-- NIVEAU 4/5 : Zone Entreprise IT -->
  <rect x="26" y="38" width="828" height="78" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="40" y="55" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">Niveaux 4 &amp; 5 — Zone Entreprise IT (Fabrique Agentique Boréal &amp; ERP SAP S/4HANA)</text>

  <rect x="40" y="63" width="256" height="44" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="168" y="81" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#1d4ed8">Agents Diagnostic &amp; Prédictif (L1)</text>
  <text x="168" y="97" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Corrélation spectrale, thermique &amp; stocks</text>

  <rect x="312" y="63" width="256" height="44" rx="4" fill="#ffffff" stroke="#475569"/>
  <text x="440" y="81" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#0f2744">Orchestrateur Durable &amp; SAP S/4HANA</text>
  <text x="440" y="97" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Ordres clients, nomenclatures &amp; coûts</text>

  <rect x="584" y="63" width="256" height="44" rx="4" fill="#ffffff" stroke="#0f5132"/>
  <text x="712" y="81" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#0f5132">Agent Planificateur d'Atelier (L2/L3)</text>
  <text x="712" y="97" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Propose un scénario paramétrique borné</text>

  <!-- Flèches IT <-> IDMZ -->
  <line x1="168" y1="138" x2="168" y2="116" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrUp)"/>
  <line x1="712" y1="116" x2="712" y2="138" stroke="#0f5132" stroke-width="1.7" marker-end="url(#arrDown)"/>

  <!-- NIVEAU 3.5 : DMZ Industrielle (IDMZ) -->
  <rect x="26" y="140" width="828" height="84" rx="5" fill="#fff7ed" stroke="#9a3412" stroke-width="1.8" stroke-dasharray="6,3"/>
  <text x="40" y="158" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#9a3412">Niveau 3.5 — DMZ Industrielle (IDMZ — Rupture protocolaire IEC 62443 SL-3 • Zéro routage IP direct IT↔OT)</text>

  <rect x="40" y="166" width="380" height="48" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="230" y="184" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#0f2744">Voie Montante : Serveur MCP OT en Lecture Seule Stricte</text>
  <text x="230" y="200" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Miroir OPC-UA AddressSpace &amp; courtier réplica MQTT Sparkplug B</text>

  <rect x="460" y="166" width="380" height="48" rx="4" fill="#ffffff" stroke="#0f5132"/>
  <text x="650" y="184" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#0f5132">Voie Descendante : Sas d'Inspection des Demandes &amp; Signatures</text>
  <text x="650" y="200" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Filtrage schéma JSON strict, mTLS SPIFFE &amp; soumission au Jumeau</text>

  <!-- Flèches IDMZ <-> Niveau 3 -->
  <line x1="200" y1="246" x2="200" y2="224" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrUp)"/>
  <line x1="650" y1="224" x2="650" y2="246" stroke="#0f5132" stroke-width="1.7" marker-end="url(#arrDown)"/>

  <!-- NIVEAU 3 : Opérations Manufacturières & Jumeau Numérique -->
  <rect x="26" y="248" width="828" height="106" rx="5" fill="#f0fdf4" stroke="#0f5132" stroke-width="1.5"/>
  <text x="40" y="266" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f5132">Niveau 3 — Opérations d'Usine (MES, Historien &amp; Validation Physique Pré-Exécution)</text>

  <rect x="40" y="275" width="235" height="68" rx="4" fill="#ffffff" stroke="#475569"/>
  <text x="157" y="294" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#0f2744">Historien &amp; Unified Namespace</text>
  <text x="157" y="310" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Séries temporelles 1 kHz, spectres,</text>
  <text x="157" y="324" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#1d4ed8">modèles OPC 40001 Machinery</text>

  <rect x="292" y="275" width="302" height="68" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.8"/>
  <text x="443" y="293" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f5132">SAS : Jumeau Numérique Déterministe (FMI 3.0)</text>
  <text x="443" y="309" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Vérifie enveloppe thermique, couple, cinématique</text>
  <text x="443" y="323" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" font-weight="bold" fill="#0f5132">Émet jeton d'homologation signé Ed25519 (ou Rejet)</text>

  <rect x="610" y="275" width="230" height="68" rx="4" fill="#ffffff" stroke="#0f2744"/>
  <text x="725" y="294" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#0f2744">MES (Siemens Opcenter)</text>
  <text x="725" y="310" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Traduit en recette homologuée ISA-88</text>
  <text x="725" y="324" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#0f5132">Vérifie fraîcheur état (Δt ≤ 5 s)</text>

  <line x1="594" y1="309" x2="610" y2="309" stroke="#0f5132" stroke-width="1.6" marker-end="url(#arrDown)"/>

  <!-- Flèches Niveau 3 <-> Niveau 2 -->
  <line x1="157" y1="376" x2="157" y2="354" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrUp)"/>
  <line x1="725" y1="354" x2="725" y2="376" stroke="#0f5132" stroke-width="1.7" marker-end="url(#arrDown)"/>

  <!-- NIVEAU 2 : Supervision Locale -->
  <rect x="26" y="378" width="828" height="62" rx="5" fill="#f8fafc" stroke="#475569" stroke-width="1.3"/>
  <text x="40" y="396" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">Niveau 2 — Supervision de Cellule (SCADA / Pupitres HMI Opérateurs)</text>
  <text x="440" y="416" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Collecte OPC-UA locale • Contrôle d'occupation de zone (barrières immatérielles) • Acquittement opérateur local HOTL / HITL sur changement de recette</text>
  <text x="440" y="431" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#1d4ed8">Application exclusivement sur frontière sécuritaire du cycle d'usinage (PackML : état IDLE ou COMPLETE)</text>

  <!-- Flèches Niveau 2 <-> Niveau 1/0 -->
  <line x1="295" y1="462" x2="295" y2="440" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrUp)"/>
  <line x1="460" y1="440" x2="460" y2="462" stroke="#0f5132" stroke-width="1.6" marker-end="url(#arrDown)"/>

  <!-- NIVEAUX 1 & 0 : Contrôle Déterministe + SIS Sanctuarisé -->
  <rect x="26" y="464" width="548" height="68" rx="5" fill="#f1f5f9" stroke="#0f2744" stroke-width="1.4"/>
  <text x="300" y="483" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">Niveaux 1 &amp; 0 — Automates PLC / CNC (&lt; 10 ms) &amp; Processus Physique</text>
  <text x="300" y="500" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Asservissements PID temps réel dur, variateurs, broches 5 axes, capteurs vibratoires</text>
  <text x="300" y="517" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#991b1b">INTERDICTION ABSOLUE d'écriture directe d'un agent IA sur un registre automate</text>

  <rect x="590" y="464" width="264" height="68" rx="5" fill="#fef2f2" stroke="#991b1b" stroke-width="2"/>
  <text x="722" y="483" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">SIS Sanctuarisé (IEC 61511 SIL 2/3)</text>
  <text x="722" y="500" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Automates de sécurité câblés indépendamment</text>
  <text x="722" y="517" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" font-weight="bold" fill="#991b1b">Isolé physiquement • Priorité d'arrêt d'urgence</text>
</svg>
