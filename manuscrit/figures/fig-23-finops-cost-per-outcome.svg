<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 455" width="880" height="455">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="880" height="455" fill="#ffffff"/>

  <text x="440" y="25" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="bold" fill="#0f2744">Architecture du Moteur FinOps Agentique &amp; Attribution du Cost-per-Outcome</text>
  <text x="440" y="43" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" fill="#475569">Agrégation Temps Réel des Coûts Complets, Disjoncteur Budgétaire par Saga et Rapprochement avec la Valeur Métier</text>

  <!-- Colonne Gauche : Sources de Coûts (Spans OTel) -->
  <rect x="18" y="60" width="246" height="278" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="141" y="81" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#0f2744">1. Flux de Consommation (Spans OTel)</text>

  <rect x="30" y="94" width="222" height="50" rx="4" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="141" y="112" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#4c1d95">Inférence Modèles (LLM &amp; SLM)</text>
  <text x="141" y="127" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Jetons entrée, sortie &amp; raisonnement</text>
  <text x="141" y="139" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#6d28d9">Remise lecture KV-cache (-75 % à -90 %)</text>

  <rect x="30" y="152" width="222" height="44" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.2"/>
  <text x="141" y="170" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f5132">Outils MCP &amp; Crédits SaaS Tiers</text>
  <text x="141" y="186" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">APIs tarifées, exécution OpenSandbox, CUA</text>

  <rect x="30" y="204" width="222" height="44" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="141" y="222" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#9a3412">Mémoire &amp; État Durable</text>
  <text x="141" y="238" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Indexation Graphiti, embeddings, Temporal</text>

  <rect x="30" y="256" width="222" height="68" rx="4" fill="#fff7ed" stroke="#9a3412" stroke-width="1.2"/>
  <text x="141" y="274" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#7c2d12">Coût Cognitif Humain (HOTL)</text>
  <text x="141" y="290" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Durée d'examen CIBA / A2UI × taux horaire</text>
  <text x="141" y="304" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#7c2d12">+ Sagas échouées ou compensées</text>

  <line x1="264" y1="198" x2="300" y2="198" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- Colonne Centrale : Compteur Temps Réel & Disjoncteur + Jointure Analytique -->
  <rect x="300" y="60" width="276" height="132" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="438" y="81" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.8" font-weight="bold" fill="#991b1b">2a. Disjoncteur Temps Réel (agentgateway)</text>
  <text x="438" y="99" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Suivi atomique Redis/Lua sur ActionEnvelope.budget</text>
  <rect x="314" y="108" width="248" height="72" rx="4" fill="#ffffff" stroke="#dc2626"/>
  <text x="324" y="125" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">• &lt; 70 % plafond : Routage nominal</text>
  <text x="324" y="142" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" font-weight="bold" fill="#b45309">• 70 % – 95 % : Repli forcé vers SLM économique</text>
  <text x="324" y="159" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" font-weight="bold" fill="#991b1b">• &gt;= 100 % : Arrêt propre Saga + Compensation</text>
  <text x="324" y="173" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#64748b">Zéro récidive de boucle non bornée le week-end</text>

  <rect x="300" y="206" width="276" height="132" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="438" y="227" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.8" font-weight="bold" fill="#0f2744">2b. Moteur de Rapprochement FinOps</text>
  <text x="438" y="244" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Jointure par saga_id &amp; business_process_code</text>
  <rect x="314" y="253" width="248" height="72" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="438" y="271" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#1e3a5f">Événements de Valeur Métier (Kafka / ERP)</text>
  <text x="438" y="287" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Garantie adjugée • Panne évitée • Litige clos</text>
  <text x="438" y="303" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#1d4ed8">Exclusion des faux positifs annulés &lt; 72h</text>
  <text x="438" y="317" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#64748b">Amortissement complet des essais infructueux</text>

  <line x1="576" y1="272" x2="612" y2="272" stroke="#0f5132" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Colonne Droite : Gouvernance Économique & Chargeback -->
  <rect x="612" y="60" width="250" height="278" rx="6" fill="#f0fdf4" stroke="#0f5132" stroke-width="1.5"/>
  <text x="737" y="81" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#0f5132">3. Pilotage Cost-per-Outcome</text>

  <rect x="624" y="95" width="226" height="68" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.3"/>
  <text x="737" y="113" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#0f2744">Équation Unitaire Nette :</text>
  <text x="737" y="131" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f5132">CPO = Σ Coûts Complets (Succès + Échecs)</text>
  <line x1="646" y1="137" x2="828" y2="137" stroke="#0f5132" stroke-width="1"/>
  <text x="737" y="152" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f5132">Nb Résultats Métiers Validés Nets</text>

  <rect x="624" y="175" width="226" height="70" rx="4" fill="#ffffff" stroke="#1e3a5f"/>
  <text x="737" y="193" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#0f2744">Refacturation Interne (Chargeback)</text>
  <text x="737" y="210" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Imputation directe BEL / BCA / BSN</text>
  <text x="737" y="225" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Clé de répartition socle partagé</text>
  <text x="737" y="239" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#1d4ed8">Comparaison continue vs coût humain</text>

  <rect x="624" y="257" width="226" height="68" rx="4" fill="#ffffff" stroke="#1e3a5f"/>
  <text x="737" y="275" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#0f2744">Arbitrage Trimestriel Portefeuille</text>
  <text x="737" y="292" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Distillation LLM → SLM spécialisé</text>
  <text x="737" y="307" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Rétrogradation L3 → Workflow L0</text>
  <text x="737" y="320" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#991b1b">• Décommissionnement agents ROI &lt; 1</text>

  <!-- Bandeau inférieur : Boucle d'optimisation FinOps -->
  <rect x="18" y="354" width="844" height="85" rx="6" fill="#f8fafc" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="440" y="375" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.8" font-weight="bold" fill="#0f2744">4. Quatre Leviers Architecturaux d'Optimisation Structurelle du Cost-per-Outcome</text>

  <rect x="30" y="386" width="196" height="42" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="128" y="403" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#1e3a5f">Affinité de Préfixe KV-Cache</text>
  <text x="128" y="419" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#475569">Prompts statiques en tête (&gt; 80 % hits)</text>

  <rect x="238" y="386" width="196" height="42" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="336" y="403" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#1e3a5f">Cascade SLM → LLM Frontière</text>
  <text x="336" y="419" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#475569">Escalade uniquement sur score d'incertitude</text>

  <rect x="446" y="386" width="196" height="42" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="544" y="403" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#1e3a5f">Hygiène des Schémas MCP</text>
  <text x="544" y="419" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#475569">Chargement progressif &lt; 12 outils actifs</text>

  <rect x="654" y="386" width="196" height="42" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="752" y="403" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#1e3a5f">Budget de Raisonnement Borné</text>
  <text x="752" y="419" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#475569">Plafond max_reasoning_tokens par tâche</text>
</svg>
