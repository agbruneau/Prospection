<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490">
  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="880" height="490" fill="#ffffff"/>
  <text x="440" y="26" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="bold" fill="#0f2744">Architecture de Défense en Profondeur : Garde-Fous Neuro-Symboliques, OpenSandbox et Kill Switch</text>

  <!-- Colonne 1 : Zone Cognitive Non Fiable -->
  <rect x="20" y="46" width="184" height="312" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="112" y="68" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#334155">1. Plan Cognitif</text>
  <text x="112" y="83" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#dc2626">(Présumé faillible / compromis)</text>

  <rect x="34" y="102" width="156" height="106" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="112" y="124" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">Cellule Agentique LLM</text>
  <text x="112" y="142" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Raisonnement probabiliste</text>
  <text x="112" y="157" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Propose une intention :</text>
  <text x="112" y="174" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" font-weight="bold" fill="#1d4ed8">• Appel d'outil MCP</text>
  <text x="112" y="189" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" font-weight="bold" fill="#1d4ed8">• Code Python / Script CUA</text>

  <rect x="34" y="226" width="156" height="114" rx="4" fill="#fff7ed" stroke="#b45309" stroke-width="1.1"/>
  <text x="112" y="246" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#7c2d12">Postulat Zero Trust :</text>
  <text x="112" y="264" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Aucun invariant métier,</text>
  <text x="112" y="279" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">plafond financier ou secret</text>
  <text x="112" y="294" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">maître ne réside jamais</text>
  <text x="112" y="309" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">dans le prompt système</text>
  <text x="112" y="324" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">du modèle de langage.</text>

  <line x1="204" y1="155" x2="236" y2="155" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arrowBlue)"/>

  <!-- Colonne 2 : Interception PEP + Décision PDP hors du LLM -->
  <rect x="236" y="46" width="290" height="312" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="381" y="68" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#0f2744">2. Garde-Fous Déterministes Hors du LLM</text>
  <text x="381" y="83" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#1d4ed8">(Architecture PEP / PDP Neuro-Symbolique)</text>

  <rect x="252" y="100" width="258" height="96" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="381" y="120" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">PEP : Passerelle agentgateway</text>
  <text x="381" y="137" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Vérifie mTLS / DPoP &amp; chaîne JWT RFC 8693</text>
  <text x="381" y="152" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Valide le schéma MCP épinglé (SHA-256)</text>
  <text x="381" y="167" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Extrait (principal, delegator, action, args)</text>
  <text x="381" y="182" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1d4ed8">• Bloque tout contournement réseau direct</text>

  <!-- Aller-retour PEP <-> PDP -->
  <line x1="355" y1="196" x2="355" y2="226" stroke="#0f5132" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <line x1="407" y1="226" x2="407" y2="196" stroke="#0f5132" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="381" y="215" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.2" font-weight="bold" fill="#0f5132">&lt; 1,5 ms</text>

  <rect x="252" y="226" width="258" height="116" rx="4" fill="#f0fdf4" stroke="#0f5132" stroke-width="1.5"/>
  <text x="381" y="246" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f5132">PDP : Moteur Cedar / OPA (Rego)</text>
  <text x="381" y="264" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Règles formelles vérifiées par solveur SMT</text>
  <text x="381" y="279" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Sémantique forbid prioritaire (plafonds, SoD)</text>
  <text x="381" y="294" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Contrôle de teinte (interdit écriture si Taint)</text>
  <text x="381" y="309" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Zéro probabilité d'injection de prompt</text>
  <text x="381" y="328" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" font-weight="bold" fill="#0f5132">Décision : ALLOW | DENY | STEP_UP_CIBA</text>

  <line x1="526" y1="148" x2="558" y2="148" stroke="#0f5132" stroke-width="1.7" marker-end="url(#arrowGreen)"/>

  <!-- Colonne 3 : Confinement d'Exécution OpenSandbox -->
  <rect x="558" y="46" width="302" height="312" rx="6" fill="#f0fdf4" stroke="#0f5132" stroke-width="1.6"/>
  <text x="709" y="68" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#0f5132">3. Exécution Confinée (AAIF OpenSandbox)</text>
  <text x="709" y="83" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#0f5132">(Isolation Matérielle &amp; Zéro Egress par Défaut)</text>

  <rect x="574" y="100" width="270" height="118" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.3"/>
  <text x="709" y="120" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">MicroVM Firecracker / Module WASI 0.2</text>
  <text x="709" y="138" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Noyau invité dédié (KVM) ou bac à capacités WASI</text>
  <text x="709" y="153" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Restauration snapshot &lt; 15 ms • Rootfs lecture seule</text>
  <text x="709" y="168" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Quotas stricts CPU / RAM / descripteurs / PIDs</text>
  <text x="709" y="183" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#dc2626">• Egress réseau = DENY ALL (aucun accès Internet</text>
  <text x="709" y="198" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#dc2626">ni API métadonnées cloud 169.254.169.254)</text>

  <rect x="574" y="232" width="270" height="110" rx="4" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="709" y="252" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#1e3a5f">Mandataire de Secrets (Credential Vault Proxy)</text>
  <text x="709" y="270" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Le code dans la microVM ne voit aucun jeton réel</text>
  <text x="709" y="285" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Sortie unique via vsock vers liste blanche stricte</text>
  <text x="709" y="300" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Injection TLS/OAuth à la frontière externe</text>
  <text x="709" y="318" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" font-weight="bold" fill="#0f5132">Destruction cryptographique après chaque tâche</text>

  <!-- Bandeau inférieur transversal : Coupe-circuit Kill Switch SOC -->
  <rect x="20" y="378" width="840" height="94" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.7"/>
  <text x="36" y="400" font-family="Segoe UI, Calibri, sans-serif" font-size="11.2" font-weight="bold" fill="#991b1b">4. Coupe-Circuit Centralisé Multi-Nuages (SOC Kill Switch — Cible &lt; 2 s • Plafond S-14 &lt; 10 s)</text>

  <rect x="36" y="412" width="250" height="46" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="161" y="430" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#991b1b">Détection Télémétrique Continue</text>
  <text x="161" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Flux OTel gen_ai.* • Dérive coût/sauts • Alerte SIEM</text>

  <line x1="286" y1="435" x2="316" y2="435" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>

  <rect x="316" y="412" width="260" height="46" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="446" y="430" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#991b1b">Signalisation OpenID SSF / CAEP</text>
  <text x="446" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Révocation SVID SPIRE + Blocage cache PEP</text>

  <line x1="576" y1="435" x2="606" y2="435" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>

  <rect x="606" y="412" width="238" height="46" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="725" y="430" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#991b1b">Gel Forensique &amp; Purge Exécution</text>
  <text x="725" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Pause sagas Temporal + Purge microVMs actives</text>

  <!-- Flèches d'action du Kill Switch vers les couches supérieures -->
  <line x1="381" y1="378" x2="381" y2="358" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <line x1="709" y1="378" x2="709" y2="358" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowRed)"/>
</svg>
