  <text x="340" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Compression contexte + cache</text>
  <text x="340" y="462" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" font-weight="bold" fill="#0f2744">0,74 $ CAD / résultat</text>

  <line x1="432" y1="446" x2="452" y2="446" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#arrBlue31)"/>

  <rect x="454" y="412" width="184" height="68" rx="4" fill="#ffffff" stroke="#4c1d95"/>
  <text x="546" y="429" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#4c1d95">T3 — 1re Distillation SLM</text>
  <text x="546" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">65 % trafic sur SLM LoRA</text>
  <text x="546" y="462" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" font-weight="bold" fill="#0f2744">0,39 $ CAD / résultat</text>

  <line x1="638" y1="446" x2="658" y2="446" stroke="#0f5132" stroke-width="1.4" marker-end="url(#arrGreen31)"/>

  <rect x="660" y="412" width="178" height="68" rx="4" fill="#ecfdf5" stroke="#0f5132" stroke-width="1.3"/>
  <text x="749" y="429" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#0f5132">T4 — Régime Continu</text>
  <text x="749" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#1e293b">86 % SLM + 14 % Teacher</text>
  <text x="749" y="462" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" font-weight="bold" fill="#0f5132">0,19 $ CAD / résultat (-85 %)</text>
