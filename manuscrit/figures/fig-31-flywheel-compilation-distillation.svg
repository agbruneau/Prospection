  <rect x="42" y="412" width="184" height="68" rx="4" fill="#ffffff" stroke="#9a3412"/>
  <text x="134" y="429" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#9a3412">T1 — Amorçage (100 % LLM)</text>
  <text x="134" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Collecte traces initiales</text>
  <text x="134" y="462" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" font-weight="bold" fill="#0f2744">1,28 $ CAD / résultat</text>

  <line x1="226" y1="446" x2="246" y2="446" stroke="#0f2744" stroke-width="1.4" marker-end="url(#arrNavy31)"/>

  <rect x="248" y="412" width="184" height="68" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
