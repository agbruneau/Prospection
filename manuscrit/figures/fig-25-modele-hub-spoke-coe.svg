  <text x="36" y="79" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">• Cycle de vie unifié : onboarding/offboarding NHI couplé au SIRH</text>
  <text x="36" y="95" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">• Refonte des fiches de poste &amp; parcours de requalification certifiants</text>
  <text x="36" y="111" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">• Dialogue social : transparence algorithmique &amp; droit à la déconnexion</text>

