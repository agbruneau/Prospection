  <text x="468" y="79" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">• Console différentielle A2UI (preuves contradictoires, zéro prose flatteuse)</text>
  <text x="468" y="95" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">• Budget cognitif borné (&lt;= 35 arbitrages complexes / quart) &amp; CIBA</text>
  <text x="468" y="111" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" font-weight="bold" fill="#9a3412">• Injection de Tests Canaris (anti-complaisance OWASP ASI09)</text>

