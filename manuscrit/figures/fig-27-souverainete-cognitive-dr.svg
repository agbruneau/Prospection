  <text x="34" y="230" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• État Temporal &amp; graphe Graphiti locaux</text>
  <text x="34" y="246" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• KV-cache isolé chiffré en mémoire</text>
  <text x="34" y="262" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Zéro transit sous CLOUD Act non chiffré</text>
  <rect x="34" y="278" width="240" height="72" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
