  <text x="320" y="213" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8">Raisonnement Complexe (System-2)</text>
  <text x="320" y="230" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Entrées expurgées de PII directe</text>
