  <text x="163" y="454" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Mise en pause des activités Temporal</text>
  <text x="163" y="469" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Zéro perte de transaction (RPO = 0)</text>

  <line x1="288" y1="451" x2="313" y2="451" stroke="#0f2744" stroke-width="1.4" marker-end="url(#arrNavy27)"/>

  <rect x="315" y="420" width="250" height="62" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="440" y="438" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" font-weight="bold" fill="#1d4ed8">2. Commutation Profil (T + 3 min)</text>
  <text x="440" y="454" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Activation gabarit prompt Open-Weights</text>
  <text x="440" y="469" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Montée en charge auto-scaling GPU</text>

  <line x1="565" y1="451" x2="590" y2="451" stroke="#0f5132" stroke-width="1.4" marker-end="url(#arrGreen27)"/>

  <rect x="592" y="420" width="250" height="62" rx="4" fill="#ffffff" stroke="#0f5132"/>
  <text x="717" y="438" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" font-weight="bold" fill="#0f5132">3. Reprise Bornée (T + 12 min)</text>
  <text x="717" y="454" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Seuils d'escalade HOTL resserrés +15 %</text>
  <text x="717" y="469" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Continuité métier certifiée en audit</text>
</svg>
