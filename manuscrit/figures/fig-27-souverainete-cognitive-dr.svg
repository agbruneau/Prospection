  <text x="154" y="313" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#1e293b">Attestation matérielle distante</text>
  <text x="154" y="328" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#1e293b">Libération clé HSM uniquement si</text>
  <text x="154" y="342" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#0f2744">mesure PCR firmware conforme</text>

