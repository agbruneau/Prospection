  <rect width="880" height="515" fill="#ffffff"/>

  <text x="440" y="25" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14" font-weight="bold" fill="#0f2744">Souveraineté Cognitive : Résidence Juridictionnelle, Enclaves GPU TEE et Reprise Cognitive (Cognitive DR)</text>

  <!-- Plan de contrôle souverain en amont -->
  <rect x="20" y="44" width="840" height="92" rx="7" fill="#f0f5fa" stroke="#0f2744" stroke-width="1.6"/>
  <text x="440" y="64" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.2" font-weight="bold" fill="#0f2744">Cellule de Contrôle Juridictionnel &amp; Cryptographique (Agentgateway Souverain + HSM HYOK)</text>

  <rect x="38" y="76" width="252" height="48" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.1"/>
  <text x="164" y="95" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" font-weight="bold" fill="#0f2744">Routeur Géofencé (Cedar)</text>
  <text x="164" y="112" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Classification : Loi 25 • E-23 • UE</text>

  <rect x="314" y="76" width="252" height="48" rx="4" fill="#ffffff" stroke="#4c1d95" stroke-width="1.1"/>
  <text x="440" y="95" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" font-weight="bold" fill="#4c1d95">Pseudonymisation Réversible</text>
  <text x="440" y="112" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Jetons HMAC-FPE détenus en HSM local</text>

  <rect x="590" y="76" width="252" height="48" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.1"/>
  <text x="716" y="95" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" font-weight="bold" fill="#0f5132">Sonde de Santé &amp; Parité Cognitive</text>
  <text x="716" y="112" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Disjoncteur SLA, latence, retrait API</text>

