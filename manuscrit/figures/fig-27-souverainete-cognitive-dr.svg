  <text x="606" y="230" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Grappe vLLM / SGLang pré-chauffée</text>
  <text x="606" y="246" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Poids ouverts audités &amp; figés en registre</text>
  <text x="606" y="262" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Adaptateurs de consignes pré-calibrés</text>
