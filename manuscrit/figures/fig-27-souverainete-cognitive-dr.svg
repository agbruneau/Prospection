  <line x1="164" y1="136" x2="154" y2="168" stroke="#0f2744" stroke-width="1.5" marker-end="url(#arrNavy27)"/>
  <line x1="440" y1="136" x2="440" y2="168" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrBlue27)"/>
  <line x1="716" y1="136" x2="726" y2="168" stroke="#0f5132" stroke-width="1.5" marker-end="url(#arrGreen27)"/>

  <!-- Couloir 1 : Zone Souveraine Canada / Québec -->
  <rect x="20" y="170" width="268" height="196" rx="6" fill="#ffffff" stroke="#0f2744" stroke-width="1.5"/>
  <rect x="20" y="170" width="268" height="26" rx="6" fill="#0f2744"/>
