<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480">
  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="880" height="480" fill="#ffffff"/>
  <text x="440" y="26" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="bold" fill="#0f2744">Délégation Cryptographique Multi-Sauts : Attestation SPIFFE, Échange RFC 8693 et Escalade CIBA</text>

  <!-- Bandeau supérieur : Plan d'Identité et d'Attestation -->
  <rect x="20" y="42" width="840" height="84" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
  <text x="36" y="61" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">Plan d'Autorité Zero Trust : Attestation de Charge de Travail &amp; Serveur d'Autorisation (OAuth 2.1 STS)</text>

  <rect x="36" y="71" width="380" height="44" rx="4" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="226" y="89" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a5f">Serveur SPIRE (Attestation Continue NHI)</text>
  <text x="226" y="105" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">Émet X.509-SVID &amp; JWT-SVID (TTL 15 min, zéro secret statique)</text>

  <rect x="444" y="71" width="400" height="44" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="644" y="89" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#1d4ed8">Microsoft Entra Agent ID / STS OAuth 2.1 (RFC 8693 + RAR)</text>
  <text x="644" y="105" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">Valide FIC SPIFFE • Atténue la portée • Imbrique sub + act + cnf</text>

  <!-- Bandeau central : Chaîne d'exécution et d'atténuation -->
  <rect x="20" y="142" width="840" height="214" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="36" y="163" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">Chaîne d'Exécution à Portée Monotone Décroissante (P2 &lt; P1 &lt; P0)</text>

  <!-- Maillon 0 : Humain -->
  <rect x="34" y="178" width="150" height="92" rx="5" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.4"/>
  <text x="109" y="198" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">1. Sujet Initiateur</text>
  <text x="109" y="214" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#334155">Employé authentifié OIDC</text>
  <text x="109" y="230" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#1d4ed8">sub: "emp-8841"</text>
  <text x="109" y="245" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">Portée P0 : incident.manage,</text>
  <text x="109" y="258" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">warranty.read, sap.reserve</text>

  <line x1="184" y1="224" x2="232" y2="224" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="208" y="216" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#1d4ed8">Jeton T0</text>

  <!-- Maillon 1 : Orchestrateur -->
  <rect x="232" y="178" width="190" height="92" rx="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="327" y="198" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">2. Agent Orchestrateur</text>
  <text x="327" y="214" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#0f5132">spiffe://boreal.ca/ns/bsn/sa/orch</text>
  <text x="327" y="230" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Échange RFC 8693 Saut 1 → T1</text>
  <text x="327" y="245" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">sub: "emp-8841" | act: orch</text>
  <text x="327" y="258" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1d4ed8">Portée P1 : warranty.evaluate</text>

  <!-- Flèches verticales vers SPIRE et STS -->
  <line x1="285" y1="178" x2="285" y2="115" stroke="#1e3a5f" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowNavy)"/>
  <line x1="375" y1="178" x2="520" y2="115" stroke="#1d4ed8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>

  <line x1="422" y1="224" x2="474" y2="224" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="448" y="214" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#1d4ed8">A2A + T1</text>
  <text x="448" y="238" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8" fill="#0f5132">(DPoP)</text>

  <!-- Maillon 2 : Agent Spécialiste -->
  <rect x="474" y="178" width="192" height="92" rx="5" fill="#ffffff" stroke="#0f5132" stroke-width="1.6"/>
  <text x="570" y="198" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f5132">3. Spécialiste Domaine BCA</text>
  <text x="570" y="214" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#0f5132">spiffe://boreal.ca/ns/bca/sa/warr</text>
  <text x="570" y="230" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Échange RFC 8693 Saut 2 → T2</text>
  <text x="570" y="245" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">act: {sub: warr, act: {sub: orch}}</text>
  <text x="570" y="258" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#0f5132">Portée P2 (RAR) : contrat #90441</text>

  <line x1="595" y1="178" x2="644" y2="115" stroke="#1d4ed8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>

  <line x1="666" y1="224" x2="714" y2="224" stroke="#0f5132" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="690" y="214" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#0f5132">MCP + T2</text>
  <text x="690" y="238" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8" fill="#0f5132">(mTLS)</text>

  <!-- Maillon 3 : Serveur MCP & SoR -->
  <rect x="714" y="178" width="132" height="92" rx="5" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="780" y="198" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">4. Serveur MCP</text>
  <text x="780" y="214" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#1d4ed8">via agentgateway</text>
  <text x="780" y="231" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">Vérifie cnf (x5t#S256)</text>
  <text x="780" y="245" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">Journalise sub + act</text>
  <text x="780" y="259" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#0f2744">dans Guidewire / DB2</text>

  <!-- Encadré preuve de possession et invariants dans le bandeau central -->
  <rect x="34" y="284" width="812" height="58" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="440" y="303" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f2744">Garanties Cryptographiques du Jeton T2 (Sender-Constrained JWT) :</text>
  <text x="440" y="320" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">• Identité initiale préservée (sub = emp-8841) • Généalogie complète et non répudiable des agents traversés (act imbriqué)</text>
  <text x="440" y="334" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">• Jeton inutilisable en cas d'exfiltration grâce à cnf (empreinte clé privée DPoP jkt ou certificat mTLS x5t#S256) • TTL &lt;= 300 s</text>

  <!-- Bandeau inférieur : Escalade asynchrone hors bande CIBA -->
  <rect x="20" y="372" width="840" height="92" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="36" y="393" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#7c2d12">Escalade Hors Bande sur Exception de Politique (Montant &gt; 5 000 $ CAD) — Protocole OpenID CIBA</text>

  <rect x="36" y="405" width="235" height="46" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="153" y="423" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#7c2d12">1. Suspension Durable (Temporal)</text>
  <text x="153" y="439" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">POST /bc-authorize + condensat tx_hash</text>

  <line x1="271" y1="428" x2="320" y2="428" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowAmber)"/>

  <rect x="320" y="405" width="255" height="46" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="447" y="423" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#7c2d12">2. Défi Hors Bande FIDO2 / Passkey</text>
  <text x="447" y="439" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Superviseur distinct (SoD : approver != sub)</text>

  <line x1="575" y1="428" x2="624" y2="428" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrowAmber)"/>

  <rect x="624" y="405" width="220" height="46" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.3"/>
  <text x="734" y="423" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f5132">3. Jeton CIBA Borné à la Transaction</text>
  <text x="734" y="439" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Usage unique • Lié à tx_hash • Audit E-23</text>

  <!-- Lien entre Spécialiste et CIBA -->
  <line x1="570" y1="270" x2="570" y2="372" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowAmber)"/>
</svg>
