<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="#ffffff"/>

  <text x="440" y="26" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="bold" fill="#0f2744">Architecture Sémantique Duale : Apache Ossie (Analytique) &amp; Ontologie Causale (Opérationnelle)</text>

  <!-- Bandeau supérieur : Planificateur & Résolveur Neuro-Symbolique -->
  <rect x="20" y="44" width="840" height="82" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="440" y="65" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">Médiateur Neuro-Symbolique Pré-Planification (GraphRAG Hybride + Vérificateur d'Invariants)</text>

  <rect x="40" y="76" width="245" height="38" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="162" y="93" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">1. Désambiguïsation des Termes</text>
  <text x="162" y="107" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Résout synonymes &amp; clés canoniques</text>

  <line x1="285" y1="95" x2="318" y2="95" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="318" y="76" width="245" height="38" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="440" y="93" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">2. Lecture Analytique Exacte</text>
  <text x="440" y="107" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Exécute les métriques certifiées Ossie</text>

  <line x1="563" y1="95" x2="596" y2="95" stroke="#0f5132" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="596" y="76" width="244" height="38" rx="4" fill="#ffffff" stroke="#0f5132"/>
  <text x="718" y="93" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f5132">3. Validation Préconditions Action</text>
  <text x="718" y="107" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Vérifie états légaux avant appel MCP</text>

  <!-- Flèches verticales bidirectionnelles vers les deux piliers -->
  <line x1="225" y1="126" x2="225" y2="152" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <line x1="655" y1="126" x2="655" y2="152" stroke="#0f5132" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <!-- Pilier Gauche : Couche Sémantique Analytique Apache Ossie -->
  <rect x="20" y="152" width="408" height="202" rx="6" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="224" y="174" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">Couche Sémantique Analytique — Apache Ossie (YAML)</text>
  <text x="224" y="190" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1d4ed8">Orientée Lecture, Vérité Chiffrée &amp; Agrégations Sans Text-to-SQL Brut</text>

  <rect x="36" y="202" width="180" height="62" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="126" y="220" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#1e293b">datasets &amp; relationships</text>
  <text x="126" y="236" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">Jointures certifiées, clés primaires</text>
  <text x="126" y="250" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">Cardinalités explicites (1:N)</text>

  <rect x="232" y="202" width="180" height="62" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="322" y="220" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#1e293b">fields &amp; metrics</text>
  <text x="322" y="236" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">Calculs gouvernés : Stock ATP,</text>
  <text x="322" y="250" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">Client Actif, Marge, SLA</text>

  <rect x="36" y="276" width="376" height="64" rx="4" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="224" y="295" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">Bloc ai_context (Ancrage Sémantique Agentique)</text>
  <text x="224" y="311" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Instructions métier normatives, synonymes par division, exclusions</text>
  <text x="224" y="326" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1d4ed8">Compilé vers : Snowflake Semantic Views • dbt • Cube • Serveurs MCP</text>

  <!-- Pont horizontal central entre les deux piliers -->
  <line x1="428" y1="252" x2="452" y2="252" stroke="#1e3a5f" stroke-width="1.8"/>

  <!-- Pilier Droit : Ontologie Opérationnelle Causale -->
  <rect x="452" y="152" width="408" height="202" rx="6" fill="#ecfdf5" stroke="#0f5132" stroke-width="1.5"/>
  <text x="656" y="174" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f5132">Ontologie Opérationnelle Causale (Graphe &amp; Contrats)</text>
  <text x="656" y="190" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#0f5132">Orientée Action, États Légaux, Invariants SHACL &amp; Mutations Sûres</text>

  <rect x="468" y="202" width="180" height="62" rx="4" fill="#ffffff" stroke="#0f5132"/>
  <text x="558" y="220" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f5132">Objets &amp; États Légaux</text>
  <text x="558" y="236" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Équipement, Contrat, Réservation</text>
  <text x="558" y="250" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Automates d'états autorisés</text>

  <rect x="664" y="202" width="180" height="62" rx="4" fill="#ffffff" stroke="#0f5132"/>
  <text x="754" y="220" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f5132">Contraintes &amp; Causalité</text>
  <text x="754" y="236" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Invariants SHACL / Cedar</text>
  <text x="754" y="250" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Dépendances inter-divisions</text>

  <rect x="468" y="276" width="376" height="64" rx="4" fill="#ffffff" stroke="#9a3412" stroke-width="1.2"/>
  <text x="656" y="295" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#7c2d12">Types d'Actions Cinétiques (ActionTypes Gouvernés)</text>
  <text x="656" y="311" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Préconditions formelles • Effets attendus • Outil MCP de compensation</text>
  <text x="656" y="326" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#9a3412">Bloque tout plan violant un invariant avant exécution transactionnelle</text>

  <!-- Flèches vers les Systems of Record en bas -->
  <line x1="150" y1="354" x2="150" y2="380" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
  <line x1="440" y1="354" x2="440" y2="380" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
  <line x1="730" y1="354" x2="730" y2="380" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#arrowNavy)"/>

  <!-- Bandeau inférieur : Patrimoine Hétérogène Réconcilié (Groupe Boréal) -->
  <rect x="20" y="380" width="840" height="74" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="440" y="400" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#1e293b">Systèmes d'Enregistrement Hétérogènes Réconciliés via Clés Maîtres Canoniques (MDM)</text>

  <rect x="36" y="410" width="252" height="34" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="162" y="431" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">BSN : Salesforce CRM &amp; ServiceNow FSM</text>

  <rect x="314" y="410" width="252" height="34" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="440" y="431" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">BCA : IBM i (AS/400), Guidewire &amp; Snowflake</text>

  <rect x="592" y="410" width="252" height="34" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="718" y="431" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">BEL : SAP S/4HANA (MM/SD) &amp; Siemens MES</text>
</svg>
