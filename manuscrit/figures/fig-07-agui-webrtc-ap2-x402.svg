<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
  <defs>
    <marker id="mBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="mGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="mBrown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9a3412"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="#ffffff"/>
  <text x="440" y="25" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14.5" font-weight="bold" fill="#0f2744">Architecture du Dernier Kilomètre : Interfaces Multimodales (AG-UI, A2UI, WebRTC) et Commerce (AP2, x402)</text>

  <!-- VOLET A : Interfaces Humain-Agent -->
  <rect x="24" y="40" width="832" height="192" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="40" y="61" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">Volet A — Interaction Humain-Agent Réactive (AG-UI / A2UI) et Multimodalité Temps Réel (WebRTC)</text>

  <!-- Poste Opérateur -->
  <rect x="40" y="72" width="222" height="146" rx="4" fill="#ffffff" stroke="#0f2744" stroke-width="1.3"/>
  <text x="151" y="92" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">Poste Opérateur / Technicien</text>
  <text x="151" y="111" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Catalogue local de composants</text>
  <text x="151" y="125" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#1d4ed8">  homologués (rendu A2UI natif)</text>
  <text x="151" y="143" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• État local synchronisé par patch</text>
  <text x="151" y="161" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Casque antibruit mains libres</text>
  <text x="151" y="176" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#0f5132">• VAD &amp; Barge-in &lt; 200 ms</text>
  <text x="151" y="195" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#64748b">Clé matérielle FIDO2 / WebAuthn</text>

  <!-- Canaux AG-UI et WebRTC -->
  <line x1="262" y1="112" x2="296" y2="112" stroke="#1d4ed8" stroke-width="1.5" marker-start="url(#mBlue)" marker-end="url(#mBlue)"/>
  <line x1="262" y1="180" x2="296" y2="180" stroke="#15803d" stroke-width="1.5" marker-start="url(#mGreen)" marker-end="url(#mGreen)"/>

  <rect x="296" y="74" width="288" height="66" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="440" y="93" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#1d4ed8">Flux Événementiel AG-UI (SSE / WebSockets)</text>
  <text x="440" y="110" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">STATE_SNAPSHOT &amp; STATE_DELTA (RFC 6902)</text>
  <text x="440" y="125" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Descripteurs déclaratifs A2UI / MCP-UI (Zéro JS libre)</text>

  <rect x="296" y="150" width="288" height="68" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
  <text x="440" y="169" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#14532d">Session WebRTC Full-Duplex (UDP / SRTP)</text>
  <text x="440" y="186" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Audio Opus 24 kHz + Flux vidéo inspection 2 fps</text>
  <text x="440" y="202" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#166534">SCTP DataChannel : purge tampon &amp; troncature tour</text>

  <line x1="584" y1="112" x2="618" y2="112" stroke="#1d4ed8" stroke-width="1.5" marker-start="url(#mBlue)" marker-end="url(#mBlue)"/>
  <line x1="584" y1="180" x2="618" y2="180" stroke="#15803d" stroke-width="1.5" marker-start="url(#mGreen)" marker-end="url(#mGreen)"/>

  <!-- Agent Interface -->
  <rect x="618" y="72" width="222" height="146" rx="4" fill="#ffffff" stroke="#0f2744" stroke-width="1.3"/>
  <text x="729" y="92" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">Agent d'Interface &amp; Médiation</text>
  <text x="729" y="111" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Niveau L1 (zéro écriture directe SI)</text>
  <text x="729" y="129" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Détection sémantique fin de tour</text>
  <text x="729" y="147" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Synthèse des preuves HOTL</text>
  <text x="729" y="165" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#1d4ed8">• Délégation vers pairs A2A v1.0</text>
  <text x="729" y="185" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#991b1b">Marquage transparence EU AI Act</text>

  <!-- VOLET B : Commerce Agentique AP2 + x402 -->
  <rect x="24" y="248" width="832" height="206" rx="6" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5"/>
  <text x="40" y="269" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#7c2d12">Volet B — Chaîne Transactionnelle Vérifiable AP2 (W3C VC / FIDO) et Règlement Programmable HTTP x402</text>

  <!-- Étape 1 : Mandat AP2 -->
  <rect x="40" y="282" width="182" height="112" rx="4" fill="#ffffff" stroke="#7c2d12" stroke-width="1.3"/>
  <text x="131" y="301" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#7c2d12">1. Mandats AP2 (W3C VC)</text>
  <text x="131" y="319" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Signature FIDO2 / HSM :</text>
  <text x="131" y="336" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">• Intent Mandate : budget,</text>
  <text x="131" y="350" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">  DID marchands, TTL</text>
  <text x="131" y="367" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#9a3412">• Cart Mandate : hash</text>
  <text x="131" y="381" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#9a3412">  SHA-256 panier exact</text>

  <line x1="222" y1="338" x2="246" y2="338" stroke="#9a3412" stroke-width="1.5" marker-end="url(#mBrown)"/>

  <!-- Étape 2 : Contrôle Politique -->
  <rect x="246" y="282" width="186" height="112" rx="4" fill="#ffffff" stroke="#9a3412" stroke-width="1.3"/>
  <text x="339" y="301" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#7c2d12">2. Agent Acheteur &amp; PDP</text>
  <text x="339" y="319" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Validation déterministe Cedar :</text>
  <text x="339" y="336" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">• Prix &lt;= plafond mandat</text>
  <text x="339" y="352" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">• Bénéficiaire sur liste blanche</text>
  <text x="339" y="368" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">• Solde journalier FinOps OK</text>
  <text x="339" y="383" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1d4ed8">Clé d'idempotence paiement</text>

  <line x1="432" y1="338" x2="456" y2="338" stroke="#1d4ed8" stroke-width="1.5" marker-start="url(#mBlue)" marker-end="url(#mBlue)"/>

  <!-- Étape 3 : Échange x402 -->
  <rect x="456" y="282" width="192" height="112" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="552" y="301" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#1d4ed8">3. Protocole HTTP x402</text>
  <text x="552" y="320" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#991b1b">← HTTP 402 Payment Required</text>
  <text x="552" y="334" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#64748b">   (En-tête PAYMENT-REQUIRED)</text>
  <text x="552" y="354" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#15803d">→ Requête + PAYMENT-SIGNATURE</text>
  <text x="552" y="368" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#64748b">   (Preuve mandat AP2 + jeton)</text>
  <text x="552" y="384" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">Zéro compte pré-provisionné requis</text>

  <line x1="648" y1="338" x2="672" y2="338" stroke="#15803d" stroke-width="1.5" marker-start="url(#mGreen)" marker-end="url(#mGreen)"/>

  <!-- Étape 4 : Règlement & Audit -->
  <rect x="672" y="282" width="168" height="112" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
  <text x="756" y="301" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#14532d">4. Facilitateur &amp; Reçu</text>
  <text x="756" y="319" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">Vérification signature &amp; KYT</text>
  <text x="756" y="335" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">Compensation rails bancaires</text>
  <text x="756" y="350" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">ou jeton de dépôt réglementé</text>
  <text x="756" y="368" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" font-weight="bold" fill="#15803d">← 200 OK + PAYMENT-RESPONSE</text>
  <text x="756" y="383" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#64748b">Écriture comptable ERP liée</text>

  <!-- Bandeau bas non-répudiation -->
  <rect x="40" y="404" width="800" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="440" y="427" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.4" font-weight="bold" fill="#0f2744">Invariant d'Audit : Preuve tripartite immuable reliant l'intention humaine (FIDO2/AP2), la négociation A2A et le règlement effectif (x402).</text>
</svg>
