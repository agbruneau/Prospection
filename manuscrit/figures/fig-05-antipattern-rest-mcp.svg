<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrGrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
  </defs>

  <rect width="880" height="450" fill="#ffffff"/>

  <!-- Titre -->
  <text x="440" y="26" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14.2" font-weight="bold" fill="#0f2744">Conception d'Outils MCP : Antipattern CRUD REST 1:1 vs Façade Orientée Intention Métier</text>

  <!-- ==================== GAUCHE : ANTIPATTERN ==================== -->
  <rect x="20" y="42" width="410" height="390" rx="6" fill="#fffafa" stroke="#991b1b" stroke-width="1.6"/>
  <rect x="20" y="42" width="410" height="42" rx="6" fill="#fef2f2" stroke="#991b1b" stroke-width="1.6"/>
  <text x="225" y="60" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.2" font-weight="bold" fill="#991b1b">ANTIPATTERN — Mappage Naïf 1:1 CRUD REST -&gt; MCP</text>
  <text x="225" y="75" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#7f1d1d">Conversion automatique OpenAPI exposant 85 endpoints granulaires</text>

  <!-- Agent surchargé -->
  <rect x="34" y="94" width="382" height="50" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="225" y="113" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">Agent Surchargé (+24 500 jetons de schémas / tour)</text>
  <text x="225" y="130" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Le modèle doit improviser les jointures, l'ordre d'appels et les clés étrangères</text>

  <!-- Boucle multi-tours fragile -->
  <rect x="34" y="156" width="382" height="160" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="175" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" font-weight="bold" fill="#0f2744">6 allers-retours probabilistes séquentiels :</text>
  <text x="46" y="194" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">1. GET /equipments?serial=...  -&gt; Renvoie 92 colonnes internes brutes</text>
  <text x="46" y="212" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">2. GET /boms/{id}/components   -&gt; 400 lignes non paginées dans le prompt</text>
  <text x="46" y="230" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">3. GET /plants/stocks          -&gt; Jointure calculée de tête par le LLM</text>
  <text x="46" y="248" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">4. POST /reservations/header   -&gt; Mutation partielle (sans idempotence)</text>
  <text x="46" y="266" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" font-weight="bold" fill="#b91c1c">5. POST /reservations/line     -&gt; HTTP 500 : trace SQL opaque illisible</text>
  <text x="46" y="284" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" font-weight="bold" fill="#b91c1c">6. Réessai aveugle de l'agent  -&gt; Doublon d'entête orphelin dans SAP !</text>
  <text x="46" y="304" font-family="Segoe UI, Calibri, sans-serif" font-size="8.3" fill="#64748b">Fuite de la topologie relationnelle interne et couplage fort aux tables</text>

  <line x1="225" y1="144" x2="225" y2="155" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <!-- Bilan Antipattern -->
  <rect x="34" y="328" width="382" height="90" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="46" y="347" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#991b1b">Impact opérationnel mesuré :</text>
  <text x="46" y="365" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">• Latence médiane : 18,4 s (6 cycles d'inférence bout-à-bout)</text>
  <text x="46" y="382" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">• Coût d'inférence : 0,42 $ CAD / tentative (inflation quadratique)</text>
  <text x="46" y="399" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#991b1b">• Stabilité pass^5 : 38 % • Corruption d'état en cas d'échec partiel</text>

  <!-- ==================== DROITE : PATRON CIBLE ==================== -->
  <rect x="450" y="42" width="410" height="390" rx="6" fill="#fafffc" stroke="#0f5132" stroke-width="1.6"/>
  <rect x="450" y="42" width="410" height="42" rx="6" fill="#f0fdf4" stroke="#0f5132" stroke-width="1.6"/>
  <text x="655" y="60" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.2" font-weight="bold" fill="#0f5132">PATRON CIBLE — Serveur MCP Orienté Intention Métier</text>
  <text x="655" y="75" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#14532d">Façade de domaine gouvernée : 7 outils cohésifs alignés sur les actes métiers</text>

  <!-- Agent focalisé -->
  <rect x="464" y="94" width="382" height="50" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <text x="655" y="113" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f5132">Spécialiste Domaine (~1 350 jetons de schémas nets)</text>
  <text x="655" y="130" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">1 intention métier = 1 appel atomique typé (sap_reserve_critical_spare_part)</text>

  <line x1="655" y1="144" x2="655" y2="155" stroke="#0f5132" stroke-width="1.6" marker-end="url(#arrGrn)"/>

  <!-- Orchestration déterministe dans le serveur MCP -->
  <rect x="464" y="156" width="382" height="160" rx="4" fill="#ffffff" stroke="#15803d" stroke-width="1.3"/>
  <text x="476" y="175" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" font-weight="bold" fill="#0f2744">Exécution déterministe interne au Serveur MCP (TypeScript / Go) :</text>
  <text x="476" y="194" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">1. Vérification immédiate du cache d'idempotence (idempotencyKey)</text>
  <text x="476" y="212" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">2. Jointure rapide en code : Série -&gt; Nomenclature -&gt; Stock dépôt optimal</text>
  <text x="476" y="230" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">3. Transaction BAPI atomique unique avec bail d'expiration (ttlHoldMinutes)</text>
  <text x="476" y="248" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#0f5132">4. Projection stricte outputSchema -&gt; structuredContent (6 champs utiles)</text>
  <text x="476" y="266" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#1d4ed8">5. Si rupture : isError=true + recoveryGuidance (dépôts alternatifs triés)</text>
  <text x="476" y="286" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">6. Référence de compensation attachée (_meta.compensationTool)</text>
  <text x="476" y="304" font-family="Segoe UI, Calibri, sans-serif" font-size="8.3" fill="#64748b">Isolation totale du modèle physique SAP : zéro dette de couplage</text>

  <!-- Bilan Patron Cible -->
  <rect x="464" y="328" width="382" height="90" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
  <text x="476" y="347" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#0f5132">Impact opérationnel mesuré :</text>
  <text x="476" y="365" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">• Latence médiane : 1,7 s (1 seule inférence + appel RPC compilé)</text>
  <text x="476" y="382" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">• Coût d'inférence : 0,019 $ CAD / action (-95 % de consommation jetons)</text>
  <text x="476" y="399" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#0f5132">• Stabilité pass^5 : 96,8 % • Intégrité transactionnelle garantie</text>
</svg>
