<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 525" width="880" height="525">
  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f2744"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
  </defs>

  <rect width="880" height="525" fill="#ffffff"/>

  <text x="440" y="25" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14.5" font-weight="bold" fill="#0f2744">Gouvernance Réglementaire Croisée : Cycle ISO/IEC 42001, Empreinte Dynamique et Droit B2B (AP2)</text>

  <!-- Bandeau 1 : ISO/IEC 42001 PDCA -->
  <rect x="20" y="40" width="840" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.3"/>
  <text x="36" y="59" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">Système de Management de l'IA (AIMS) — Boucle Continue ISO/IEC 42001 &amp; Profil NIST AI RMF</text>

  <rect x="34" y="68" width="186" height="52" rx="4" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="127" y="86" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">1. PLAN (Clauses 4–6)</text>
  <text x="127" y="101" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Inventaire NHI/Agents, appétit</text>
  <text x="127" y="113" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">au risque &amp; études d'impact</text>

  <line x1="220" y1="94" x2="242" y2="94" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="242" y="68" width="186" height="52" rx="4" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="335" y="86" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">2. DO (Clauses 7–8, Annexe A)</text>
  <text x="335" y="101" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Portes CI/CD, politiques OPA/Cedar</text>
  <text x="335" y="113" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">&amp; délégation OAuth 2.1 OBO</text>

  <line x1="428" y1="94" x2="450" y2="94" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="450" y="68" width="186" height="52" rx="4" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="543" y="86" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">3. CHECK (Clause 9)</text>
  <text x="543" y="101" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Traces OTel gen_ai.*, stabilité</text>
  <text x="543" y="113" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">pass^k &amp; audit indépendant</text>

  <line x1="636" y1="94" x2="658" y2="94" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="658" y="68" width="188" height="52" rx="4" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="752" y="86" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">4. ACT (Clause 10)</text>
  <text x="752" y="101" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Kill-Switch, gestion incidents,</text>
  <text x="752" y="113" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">recalibrage seuils &amp; prompts</text>

  <line x1="440" y1="130" x2="440" y2="148" stroke="#0f2744" stroke-width="1.6" marker-end="url(#arrowNavy)"/>

  <!-- Bandeau 2 : Règle de l'Empreinte de Déploiement (Deployment Footprint) -->
  <rect x="20" y="150" width="840" height="106" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="36" y="170" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">Règle de l'Empreinte de Déploiement (Deployment Footprint) — Qualification Dynamique du Risque</text>

  <rect x="34" y="180" width="430" height="64" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.1"/>
  <text x="249" y="198" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Vecteur d'Empreinte Évalué en CI/CD et sur Passerelle :</text>
  <text x="249" y="215" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" fill="#1d4ed8">Footprint = (Modèle, Outils MCP mutatifs, Sensibilité Données/Juridiction, Autonomie L0–L4)</text>
  <text x="249" y="232" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#475569">Un même LLM change de classe légale dès qu'on lui greffe un outil d'écriture ou des PII</text>

  <line x1="464" y1="212" x2="498" y2="212" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrowBlue)"/>

  <rect x="498" y="180" width="348" height="64" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="672" y="198" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#0f2744">Moteur d'Héritage « High-Water Mark » (OPA)</text>
  <text x="672" y="215" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">Toute saga multi-agents hérite des exigences du maillon</text>
  <text x="672" y="231" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#991b1b">le plus critique (bloque le déploiement si dossier incomplet)</text>

  <!-- Flèches vers les 3 juridictions -->
  <line x1="154" y1="256" x2="154" y2="276" stroke="#0f2744" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
  <line x1="440" y1="256" x2="440" y2="276" stroke="#0f2744" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
  <line x1="726" y1="256" x2="726" y2="276" stroke="#0f2744" stroke-width="1.5" marker-end="url(#arrowNavy)"/>

  <!-- Bandeau 3 : 3 Juridictions 2026-2027 -->
  <rect x="20" y="278" width="268" height="126" rx="5" fill="#ffffff" stroke="#0f2744" stroke-width="1.4"/>
  <rect x="20" y="278" width="268" height="26" rx="5" fill="#0f2744"/>
  <text x="154" y="295" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#ffffff">BSIF / OSFI E-23 (1er mai 2027)</text>
  <text x="32" y="320" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1e293b">• Périmètre élargi aux systèmes agentiques</text>
  <text x="32" y="337" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1e293b">• Cote de matérialité &amp; validation 2e ligne</text>
  <text x="32" y="354" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1e293b">• Preuve de stabilité (pass^k) &amp; suivi dérive</text>
  <text x="32" y="371" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1e293b">• Séparation des tâches (NHI distincts)</text>
  <text x="32" y="389" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#1d4ed8">Cible : Institutions financières fédérales</text>

  <rect x="306" y="278" width="268" height="126" rx="5" fill="#ffffff" stroke="#0f5132" stroke-width="1.4"/>
  <rect x="306" y="278" width="268" height="26" rx="5" fill="#0f5132"/>
  <text x="440" y="295" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#ffffff">Loi 25 — Québec (Art. 12.1 &amp; ÉFVP)</text>
  <text x="318" y="320" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1e293b">• Avis explicite de décision 100 % automatisée</text>
  <text x="318" y="337" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1e293b">• Accès aux renseignements &amp; facteurs clés</text>
  <text x="318" y="354" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1e293b">• Droit d'observation &amp; révision humaine HOTL</text>
  <text x="318" y="371" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1e293b">• ÉFVP obligatoire avant transfert hors Québec</text>
  <text x="318" y="389" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#0f5132">Cible : Tout traitement de PII de résidents QC</text>

  <rect x="592" y="278" width="268" height="126" rx="5" fill="#ffffff" stroke="#9a3412" stroke-width="1.4"/>
  <rect x="592" y="278" width="268" height="26" rx="5" fill="#9a3412"/>
  <text x="726" y="295" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.2" font-weight="bold" fill="#ffffff">EU AI Act (Août 2026 &amp; Déc. 2027)</text>
  <text x="604" y="320" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1e293b">• Art. 50 (août 2026) : transparence &amp; marquage</text>
  <text x="604" y="337" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1e293b">• Annexe III (déc. 2027) : emploi, crédit, infra.</text>
  <text x="604" y="354" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1e293b">• Journaux automatiques Art. 12 &amp; dossier Ann. IV</text>
  <text x="604" y="371" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1e293b">• Contrôle humain effectif Art. 14 + bouton arrêt</text>
  <text x="604" y="389" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#9a3412">Cible : Mise sur le marché ou impact dans l'UE</text>

  <line x1="440" y1="404" x2="440" y2="422" stroke="#0f5132" stroke-width="1.6" marker-end="url(#arrowGreen)"/>

  <!-- Bandeau 4 : Encadrement contractuel B2B AP2 -->
  <rect x="20" y="424" width="840" height="86" rx="6" fill="#ecfdf5" stroke="#0f5132" stroke-width="1.5"/>
  <text x="36" y="443" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f5132">Encadrement Juridique et Technique du Commerce B2B Inter-Agents (A2A v1.0 + Protocole AP2)</text>

  <rect x="34" y="452" width="260" height="48" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.1"/>
  <text x="164" y="469" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">Mandat Cryptographique AP2 Borné</text>
  <text x="164" y="484" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">Plafond CAD, incoterms &amp; SKU signés (confinement</text>
  <text x="164" y="495" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">opposable du mandat apparent face au tiers)</text>

  <rect x="310" y="452" width="260" height="48" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.1"/>
  <text x="440" y="469" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">Garde-Fous Anti-Collusion &amp; Erreur</text>
  <text x="440" y="484" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">Cloisonnement mémoire par enchère, interdiction</text>
  <text x="440" y="495" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">d'alignement tarifaire &amp; seuil d'anomalie prix</text>

  <rect x="586" y="452" width="260" height="48" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.1"/>
  <text x="716" y="469" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">Preuve Non-Répudiable &amp; Contrat-Cadre</text>
  <text x="716" y="484" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">Journaux WORM scellés (JWS/Merkle), délai de</text>
  <text x="716" y="495" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#334155">rétractation erreur manifeste &amp; arbitrage</text>
</svg>
