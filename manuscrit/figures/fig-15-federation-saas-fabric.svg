<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#991b1b"/>
    </marker>
  </defs>
  <rect width="880" height="510" fill="#ffffff"/>
  <text x="440" y="25" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14.5" font-weight="bold" fill="#0f2744">Fédération des Jardins Clos SaaS : Gravité des Données, Plan Neutre et Identité OBO</text>

  <!-- Couche 1 : Surface d'interaction et Identité Racine -->
  <rect x="30" y="42" width="500" height="72" rx="5" fill="#f8fafc" stroke="#475569" stroke-width="1.3"/>
  <text x="280" y="62" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#0f2744">Surface d'Expérience Employé — Microsoft Copilot Studio (Teams / M365)</text>
  <text x="280" y="80" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" fill="#334155">Archétype 1 : Médiation &amp; Triage conversationnel (L1) • Aucune écriture directe inter-silos</text>
  <text x="280" y="97" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1d4ed8">Émet l'intention structurée vers le plan neutre avec le jeton initial de l'employé</text>

  <rect x="548" y="42" width="302" height="72" rx="5" fill="#fef2f2" stroke="#991b1b" stroke-width="1.3"/>
  <text x="699" y="62" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Chaîne d'Identité Fédérée (IdP Racine)</text>
  <text x="699" y="80" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" fill="#334155">Microsoft Entra ID ↔ OAuth 2.1 OBO (RFC 8693)</text>
  <text x="699" y="97" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#7c2d12">Pont vers SAP CIS (Principal Propagation SAML/X.509)</text>

  <!-- Flèches Couche 1 vers Couche 2 -->
  <line x1="280" y1="114" x2="280" y2="138" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <line x1="699" y1="114" x2="699" y2="138" stroke="#991b1b" stroke-width="1.6" marker-end="url(#arrRed)"/>

  <!-- Couche 2 : Plan d'Arbitrage Neutre -->
  <rect x="30" y="140" width="820" height="156" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="48" y="162" font-family="Segoe UI, Calibri, sans-serif" font-size="12" font-weight="bold" fill="#0f2744">Plan d'Orchestration Maître &amp; Médiation Neutre (Découplé des Jardins Clos SaaS)</text>

  <!-- Sous-bloc 2A : agentgateway -->
  <rect x="46" y="174" width="252" height="108" rx="4" fill="#ffffff" stroke="#7c2d12" stroke-width="1.2"/>
  <text x="172" y="193" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#7c2d12">Passerelle AI-Native (agentgateway)</text>
  <text x="172" y="211" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">• Anti-boucle : vecteur signé x-a2a-hop-vector</text>
  <text x="172" y="227" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">• Politiques Cedar / OPA &amp; filtrage PII</text>
  <text x="172" y="243" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">• Coupe-circuit FinOps (crédits SaaS + jetons)</text>
  <text x="172" y="259" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#7c2d12">• Corrélation W3C traceparent unifiée</text>

  <!-- Sous-bloc 2B : Orchestrateur & Gravité -->
  <rect x="314" y="174" width="252" height="108" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="440" y="193" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">Arbitrage &amp; État Durable (Temporal)</text>
  <text x="440" y="211" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Gravité des données (G ≥ 0,85 : local)</text>
  <text x="440" y="227" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Sagas inter-SaaS (≥ 2 domaines mutés)</text>
  <text x="440" y="243" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Annuaire fédéré OASF d'Agent Cards A2A</text>
  <text x="440" y="259" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#1d4ed8">• Modèle canonique Apache Ossie</text>

  <!-- Sous-bloc 2C : MuleSoft Agent Fabric -->
  <rect x="582" y="174" width="252" height="108" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.2"/>
  <text x="708" y="193" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f5132">Courtage iPaaS (MuleSoft Agent Fabric)</text>
  <text x="708" y="211" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Connecteurs normalisés A2A v1.0 &amp; MCP</text>
  <text x="708" y="227" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Traduction d'objets CRM ↔ ITSM ↔ ERP</text>
  <text x="708" y="243" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Lissage de débits (429) &amp; anti-tempête CDC</text>
  <text x="708" y="259" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#0f5132">• Échange OBO → Salesforce / SAP CIS</text>

  <!-- Flèches vers les 4 silos SaaS -->
  <line x1="127" y1="296" x2="127" y2="332" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <line x1="335" y1="296" x2="335" y2="332" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <line x1="546" y1="296" x2="546" y2="332" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arrDark)"/>
  <line x1="755" y1="296" x2="755" y2="332" stroke="#1e3a5f" stroke-width="1.6" marker-end="url(#arrDark)"/>

  <!-- Étiquettes de protocole sur les flèches -->
  <text x="135" y="318" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#1d4ed8">A2A + OBO</text>
  <text x="343" y="318" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#1d4ed8">A2A + OBO</text>
  <text x="554" y="318" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#7c2d12">A2A + SAP CIS</text>
  <text x="763" y="318" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#0f5132">MCP / A2A</text>

  <!-- Couche 3 : Les 4 Jardins Clos Spécialistes -->
  <rect x="30" y="334" width="194" height="118" rx="5" fill="#f8fafc" stroke="#0f2744" stroke-width="1.3"/>
  <text x="127" y="354" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">Salesforce Agentforce</text>
  <text x="127" y="371" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8">Spécialiste Domaine CRM</text>
  <text x="127" y="388" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Gravité : Comptes, opportunités,</text>
  <text x="127" y="402" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">remises commerciales, Data Cloud</text>
  <text x="127" y="420" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#64748b">Droits : Profil utilisateur CRM</text>
  <text x="127" y="436" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#991b1b">Confiné : Zéro appel direct ERP</text>

  <rect x="238" y="334" width="194" height="118" rx="5" fill="#f8fafc" stroke="#0f2744" stroke-width="1.3"/>
  <text x="335" y="354" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">ServiceNow AI Agents</text>
  <text x="335" y="371" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8">Spécialiste ITSM &amp; Terrain</text>
  <text x="335" y="388" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Gravité : CMDB, incidents,</text>
  <text x="335" y="402" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">planification techniciens FSM</text>
  <text x="335" y="420" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#64748b">Droits : ACL ServiceNow OBO</text>
  <text x="335" y="436" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#991b1b">Confiné : Délègue via Plan Neutre</text>

  <rect x="446" y="334" width="200" height="118" rx="5" fill="#f8fafc" stroke="#0f2744" stroke-width="1.3"/>
  <text x="546" y="354" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">SAP Joule (S/4HANA)</text>
  <text x="546" y="371" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8">Spécialiste ERP &amp; Finance</text>
  <text x="546" y="388" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Gravité : Stocks MM/SD, achats,</text>
  <text x="546" y="402" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">grand livre FI/CO, BAPI métier</text>
  <text x="546" y="420" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#64748b">Droits : Named User ABAP propagé</text>
  <text x="546" y="436" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#991b1b">Conformité : Digital Access tracé</text>

  <rect x="660" y="334" width="190" height="118" rx="5" fill="#f8fafc" stroke="#0f2744" stroke-width="1.3"/>
  <text x="755" y="354" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">Workday Illuminate</text>
  <text x="755" y="371" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#0f5132">Spécialiste Capital Humain</text>
  <text x="755" y="388" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Gravité : Effectifs, certifications</text>
  <text x="755" y="402" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">sécurité, organigramme, paie</text>
  <text x="755" y="420" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#64748b">Droits : Portées minimales Loi 25</text>
  <text x="755" y="436" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#991b1b">Zéro export massif de dossiers RH</text>

  <!-- Bandeau inférieur : Invariant anti-maillage sauvage -->
  <rect x="30" y="464" width="820" height="32" rx="4" fill="#fef2f2" stroke="#991b1b" stroke-width="1.1"/>
  <text x="440" y="484" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#991b1b">Invariant ADR-015 : Interdiction de tout pont A2A direct entre studios SaaS (évite les boucles A → B → C → A et l'usurpation par compte technique)</text>
</svg>
