<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450">
  <defs>
    <marker id="arrN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a5f"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="880" height="450" fill="#ffffff"/>
  <text x="440" y="25" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14.5" font-weight="bold" fill="#0f2744">Pile Réseau Inter-Agents AGNTCY : Découverte Fédérée OASF, Transport SLIM et MLS Post-Quantique</text>

  <!-- Plan supérieur : Découverte OASF + Directory + ANP -->
  <rect x="24" y="40" width="832" height="118" rx="6" fill="#f8fafc" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="40" y="61" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">Plan de Découverte Sémantique et d'Attestation de Provenance (Control Plane)</text>

  <rect x="40" y="72" width="246" height="72" rx="4" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="163" y="92" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.4" font-weight="bold" fill="#0f2744">Descripteur OASF &amp; Artefact OCI</text>
  <text x="163" y="109" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">Taxonomie normalisée skills &amp; domaines</text>
  <text x="163" y="124" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#1d4ed8">Signature d'intégrité Sigstore / Cosign</text>
  <text x="163" y="138" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#64748b">Métriques SLA, coût &amp; conformité</text>

  <line x1="286" y1="108" x2="318" y2="108" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#arrN)"/>

  <rect x="318" y="72" width="244" height="72" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="440" y="92" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.4" font-weight="bold" fill="#1d4ed8">Agent Directory Fédéré (DHT)</text>
  <text x="440" y="109" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">Indexation distribuée Kademlia</text>
  <text x="440" y="124" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">Requêtes multi-critères par capacité</text>
  <text x="440" y="138" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#64748b">Synchronisation pair-à-pair sans SPOF</text>

  <line x1="562" y1="108" x2="594" y2="108" stroke="#1d4ed8" stroke-width="1.5" marker-start="url(#arrB)" marker-end="url(#arrB)"/>

  <rect x="594" y="72" width="246" height="72" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.3"/>
  <text x="717" y="92" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.4" font-weight="bold" fill="#0f5132">Passerelle Inter-Domaines ANP</text>
  <text x="717" y="109" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">Identités Web décentralisées (did:wba)</text>
  <text x="717" y="124" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">Ancrage DNS/TLS sans registre opaque</text>
  <text x="717" y="138" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.9" fill="#64748b">Filtrage politiques DMZ B2B</text>

  <!-- Plan inférieur : SLIM + MLS -->
  <rect x="24" y="174" width="832" height="260" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="40" y="196" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">Plan de Transport Temps Réel SLIM et Chiffrement de Groupe IETF MLS (Data Plane)</text>

  <!-- Domaine Organisation A -->
  <rect x="40" y="210" width="230" height="146" rx="5" fill="#ffffff" stroke="#0f2744" stroke-width="1.4"/>
  <text x="155" y="230" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">Domaine A — Groupe Boréal</text>
  <text x="155" y="248" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">• Agent Achats BEL &amp; Agent Risque BCA</text>
  <text x="155" y="265" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">• Identités locales SPIFFE / SVID</text>
  <text x="155" y="282" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1d4ed8">• Routeur local SLIM (QUIC / HTTP/2)</text>
  <rect x="54" y="296" width="202" height="46" rx="3" fill="#f0fdf4" stroke="#15803d"/>
  <text x="155" y="314" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#14532d">Feuilles TreeKEM #1 &amp; #2</text>
  <text x="155" y="330" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#166534">Clés éphémères X25519MLKEM768</text>

  <!-- Flèches vers Relais SLIM -->
  <line x1="270" y1="283" x2="306" y2="283" stroke="#1d4ed8" stroke-width="1.6" marker-start="url(#arrB)" marker-end="url(#arrB)"/>

  <!-- Maillage de Relais SLIM -->
  <rect x="306" y="210" width="268" height="146" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.4" stroke-dasharray="6,3"/>
  <text x="440" y="230" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#92400e">Maillage de Relais SLIM (Zero-Trust)</text>
  <text x="440" y="249" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">Routage sémantique par noms hiérarchiques :</text>
  <text x="440" y="265" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#78350f">boreal/supply/rfq-session-884/*</text>
  <text x="440" y="284" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Multiplexage QUIC sans blocage HOL</text>
  <text x="440" y="301" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.1" fill="#334155">• Topologies : Unicast, Streaming, Pub/Sub</text>
  <text x="440" y="320" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#991b1b">Aveugle aux charges utiles (Chiffrées E2E)</text>
  <text x="440" y="336" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#64748b">Traversée NAT sortante uniquement (port 443)</text>

  <!-- Flèches vers Domaine B -->
  <line x1="574" y1="283" x2="610" y2="283" stroke="#1d4ed8" stroke-width="1.6" marker-start="url(#arrB)" marker-end="url(#arrB)"/>

  <!-- Domaine Organisation B -->
  <rect x="610" y="210" width="230" height="146" rx="5" fill="#ffffff" stroke="#0f5132" stroke-width="1.4"/>
  <text x="725" y="230" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f5132">Domaine B — Partenaire Externe</text>
  <text x="725" y="248" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">• Agent Cotation Transporteur Maritime</text>
  <text x="725" y="265" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">• Identité vérifiée did:wba + mTLS</text>
  <text x="725" y="282" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#0f5132">• Passerelle DMZ SLIM / A2A v1.0</text>
  <rect x="624" y="296" width="202" height="46" rx="3" fill="#f0fdf4" stroke="#15803d"/>
  <text x="725" y="314" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#14532d">Feuille TreeKEM #3</text>
  <text x="725" y="330" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#166534">Révocation atomique fin de tâche</text>

  <!-- Bandeau continu MLS de bout en bout -->
  <rect x="40" y="368" width="800" height="52" rx="4" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
  <text x="440" y="388" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.3" font-weight="bold" fill="#14532d">Tunnel Cryptographique de Bout en Bout IETF MLS (RFC 9420) — Suite Hybride Post-Quantique (FIPS 203 ML-KEM + X25519)</text>
  <text x="440" y="406" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">Rotation d'époque en O(log N) • Forward Secrecy (FS) &amp; Post-Compromise Security (PCS) contre l'interception différée</text>
</svg>
