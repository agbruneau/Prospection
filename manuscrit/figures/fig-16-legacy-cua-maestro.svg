<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520">
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9a3412"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#ffffff"/>
  <text x="440" y="25" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14.5" font-weight="bold" fill="#0f2744">Intégration Patrimoniale : Orchestration UiPath Maestro, Encapsulation MCP et CUA Confiné</text>

  <!-- Bandeau supérieur : Orchestration APA/RPA -->
  <rect x="30" y="42" width="820" height="74" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="440" y="63" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">Plan d'Orchestration Patrimoniale — UiPath Maestro + Passerelle agentgateway (BPMN / État Durable)</text>
  <text x="440" y="82" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" fill="#334155">Arbitrage déterministe : privilégier l'encapsulation programme/flux via MCP (≥ 92 % du volume) • Confiner le CUA au dernier recours (≤ 8 %)</text>
  <text x="440" y="100" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#1d4ed8">Contrôle de conformité BSIF E-23 : clés d'idempotence obligatoires, plafonds L2/L3 et escalade HOTL sur anomalie d'écran</text>

  <!-- Flèches d'aiguillage -->
  <line x1="225" y1="116" x2="225" y2="144" stroke="#0f5132" stroke-width="1.8" marker-end="url(#arrG)"/>
  <line x1="655" y1="116" x2="655" y2="144" stroke="#9a3412" stroke-width="1.8" marker-end="url(#arrO)"/>

  <!-- VOIE GAUCHE : Encapsulation MCP Déterministe -->
  <rect x="30" y="146" width="392" height="314" rx="6" fill="#f0fdf4" stroke="#0f5132" stroke-width="1.6"/>
  <text x="226" y="168" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.2" font-weight="bold" fill="#0f5132">Voie A (Prioritaire) — Serveurs MCP d'Encapsulation</text>
  <text x="226" y="184" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Zéro interface graphique • Latence 40–250 ms • Déterminisme 99,95 %</text>

  <!-- Bloc A1 : IBM i RPG -->
  <rect x="46" y="196" width="360" height="72" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.1"/>
  <text x="226" y="214" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">1. Serveur MCP IBM i (AS/400) — Programmes RPGLE / COBOL</text>
  <text x="226" y="231" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">Appel natif PCML / XMLSERVICE • Conversion EBCDIC (CP037/1147) ↔ UTF-8</text>
  <text x="226" y="247" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#0f5132">Décimales condensées COMP-3 + Registre d'idempotence DB2 for i</text>

  <!-- Bloc A2 : Mainframe CICS -->
  <rect x="46" y="278" width="360" height="72" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.1"/>
  <text x="226" y="296" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">2. Serveur MCP Mainframe z/OS — Transactions CICS / IMS</text>
  <text x="226" y="313" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Passerelle z/OS Connect / IBM MQ • Mappage COMMAREA vers JSON Schema</text>
  <text x="226" y="329" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#0f5132">Propagation d'identité jusqu'au jeton RACF / ACF2 individuel</text>

  <!-- Bloc A3 : EDI X12 -->
  <rect x="46" y="360" width="360" height="84" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.1"/>
  <text x="226" y="378" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">3. Serveur MCP Passerelle B2B — Flux EDI ANSI X12 / EDIFACT</text>
  <text x="226" y="395" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Intention JSON typée soumise par l'agent (zéro trame EDI générée par LLM)</text>
  <text x="226" y="411" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">Sérialiseur déterministe X12 / EDIFACT + contrôle ISA / GS / ST / CTT</text>
  <text x="226" y="427" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#0f5132">Transmission signée AS2 et rapprochement automatique des accusés 997 / CONTRL</text>

  <!-- VOIE DROITE : Cellule CUA Confinée -->
  <rect x="458" y="146" width="392" height="314" rx="6" fill="#fff7ed" stroke="#9a3412" stroke-width="1.6"/>
  <text x="654" y="168" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.2" font-weight="bold" fill="#9a3412">Voie B (Dernier Recours) — Cellule CUA Confinée</text>
  <text x="654" y="184" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Terminaux TN5250 / TN3270 &amp; Bureaux Citrix sans API ni code source</text>

  <!-- Étape B1 -->
  <rect x="474" y="196" width="360" height="58" rx="4" fill="#ffffff" stroke="#9a3412" stroke-width="1.1"/>
  <text x="654" y="213" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#0f2744">Étape 1 — Bac à sable VDI éphémère &amp; Masquage géométrique</text>
  <text x="654" y="229" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">Caviardage PII en amont du modèle visuel • Verrouillage matériel des</text>
  <text x="654" y="243" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#991b1b">zones interdites (Forbidden Boxes) et touches destructrices (F23 / Suppr)</text>

  <!-- Étape B2 -->
  <rect x="474" y="262" width="360" height="58" rx="4" fill="#ffffff" stroke="#9a3412" stroke-width="1.1"/>
  <text x="654" y="279" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#0f2744">Étape 2 — Pré-Assertion d'état &amp; Action atomique bornée</text>
  <text x="654" y="295" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Assertion du code d'écran 5250/Citrix et absence de fenêtre modale</text>
  <text x="654" y="309" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Exécution d'un geste atomique unique (saisie bornée, zéro rafale aveugle)</text>

  <!-- Étape B3 -->
  <rect x="474" y="328" width="360" height="58" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="654" y="345" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#1d4ed8">Étape 3 — Double Vérification Post-Action (Read-Back)</text>
  <text x="654" y="361" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Relecture OCR déterministe + Vérificateur indépendant confirmant la valeur</text>
  <text x="654" y="375" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1d4ed8">écrite à l'écran avant autorisation de la touche de validation (COMMIT)</text>

  <!-- Étape B4 -->
  <rect x="474" y="394" width="360" height="50" rx="4" fill="#fef2f2" stroke="#991b1b" stroke-width="1.1"/>
  <text x="654" y="412" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#991b1b">Étape 4 — Enregistrement WORM &amp; Piste d'Audit BSIF E-23</text>
  <text x="654" y="429" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Captures signées avant/après chaque frappe + lien traceId OpenTelemetry</text>

  <!-- Bandeau inférieur : Dette technique gérée -->
  <rect x="30" y="472" width="820" height="34" rx="4" fill="#f1f5f9" stroke="#0f2744" stroke-width="1.2"/>
  <text x="440" y="493" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#0f2744">Gouvernance du cycle de vie (ADR-016) : Chaque flux CUA homologué ouvre un chantier financé d'encapsulation MCP sous 12 mois</text>
</svg>
