  <text x="440" y="430" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" font-weight="bold" fill="#7c2d12">Oubli Sélectif Coordonné (Art. 17)</text>
  <text x="440" y="443" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Purge Blocs + Vecteurs + Arêtes PII</text>

  <rect x="590" y="414" width="254" height="38" rx="4" fill="#ffffff" stroke="#0f5132"/>
  <text x="717" y="430" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.3" font-weight="bold" fill="#0f5132">Crypto-Shredding Législatif</text>
  <text x="717" y="443" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Préserve intégrité comptable anonymisée</text>
