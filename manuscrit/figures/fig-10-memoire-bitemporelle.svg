  <text x="649" y="84" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#0f5132">Mémoire sémantique &amp; relationnelle partagée • Invalidation sans écrasement</text>

  <!-- Schéma des 2 axes temporels sur une arête -->
  <rect x="454" y="96" width="390" height="114" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.3"/>
