  <text x="649" y="132" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#1e293b">(Compresseur #90441) —[FIRMWARE_ACTIF: v4.2]—&gt; (Contrôleur HX9)</text>

  <rect x="468" y="142" width="175" height="56" rx="3" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="555" y="159" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">Axe 1 : Temps Métier Réel</text>
  <text x="555" y="174" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">valid_from : 2027-01-10</text>
  <text x="555" y="188" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#1d4ed8">valid_to : 2027-03-02 (MAJ v4.3)</text>

  <rect x="655" y="142" width="175" height="56" rx="3" fill="#f8fafc" stroke="#64748b"/>
  <text x="742" y="159" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#1e293b">Axe 2 : Temps Système</text>
  <text x="742" y="174" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">ingested_at : 2027-01-14 (Sync)</text>
  <text x="742" y="188" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#475569">superseded_at : 2027-03-02</text>

  <!-- Résolution de contradiction et requête As-Of -->
  <rect x="454" y="222" width="390" height="62" rx="4" fill="#ffffff" stroke="#1e3a5f"/>
  <text x="649" y="241" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f2744">Résolution des Retards Terrain &amp; Requêtes Point-in-Time (As-Of)</text>
  <text x="649" y="257" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Reconstruit l'état exact du monde à t_sinistre ET ce que savait l'agent à t_décision</text>
  <text x="649" y="271" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#0f5132">Auditabilité intégrale exigée par BSIF E-23 &amp; contentieux assurances</text>

  <rect x="454" y="296" width="390" height="52" rx="4" fill="#ffffff" stroke="#0f5132"/>
  <text x="649" y="315" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.8" font-weight="bold" fill="#0f5132">Sous-Graphes d'Épisodes &amp; Communautés Pré-Synthétisées</text>
  <text x="649" y="331" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Recherche hybride (BM25 + Vecteur + Traversée 2-sauts) en &lt; 65 ms p95</text>

