  <rect width="880" height="480" fill="#ffffff"/>

  <text x="440" y="26" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="bold" fill="#0f2744">Architecture de Mémoire Hybride : Hiérarchie OS (Letta) &amp; Graphe Bi-Temporel (Graphiti)</text>

  <!-- Colonne Gauche : Hiérarchie Mémoire Locale Type OS (Letta) -->
  <rect x="20" y="46" width="376" height="318" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="208" y="68" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f2744">1. Gestionnaire de Mémoire Type OS (Letta)</text>
  <text x="208" y="84" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#1d4ed8">État local par cellule agentique • Pagination explicite bornée</text>

  <rect x="36" y="96" width="344" height="74" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="208" y="114" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f2744">Core Memory Blocks (RAM Contextuelle Épinglée)</text>
  <text x="208" y="130" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Bloc Mandat &amp; Politiques (Lecture seule, signé plateforme)</text>
  <text x="208" y="145" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Bloc État Dossier &amp; Préférences (Quota strict : ex. 2 048 car.)</text>
  <text x="208" y="160" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1d4ed8">Outils : memory_replace / memory_rethink (filtrés anti-ASI06)</text>

  <line x1="208" y1="170" x2="208" y2="192" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <rect x="36" y="192" width="344" height="68" rx="4" fill="#ffffff" stroke="#64748b"/>
