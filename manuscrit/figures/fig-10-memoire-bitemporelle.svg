  <text x="208" y="227" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">Traces d'interactions, décisions passées &amp; appels d'outils</text>
  <text x="208" y="242" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">Éviction FIFO avec synthèse structurée sur dépassement</text>

  <line x1="208" y1="260" x2="208" y2="282" stroke="#1e3a5f" stroke-width="1.5" marker-end="url(#arrowNavy)"/>

  <rect x="36" y="282" width="344" height="66" rx="4" fill="#fff7ed" stroke="#9a3412"/>
  <text x="208" y="301" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#7c2d12">Garde d'Écriture Déterministe (MemoryWriteGuard)</text>
  <text x="208" y="317" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Vérifie provenance source, bloque instructions cachées (ASI06)</text>
  <text x="208" y="332" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#9a3412">Scelle tenant_id + subject_id avant toute persistance</text>

