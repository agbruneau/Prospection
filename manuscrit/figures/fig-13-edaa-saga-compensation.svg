<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3a5f"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="#ffffff"/>
  <text x="440" y="25" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14.5" font-weight="bold" fill="#0f2744">Architecture Événementielle Agentique (EDAA) et Cycle d'une Saga à Compensation</text>

  <!-- Bande 1 : Maillage événementiel hybride -->
  <rect x="28" y="40" width="824" height="98" rx="6" fill="#ecfdf5" stroke="#0f5132" stroke-width="1.6"/>
  <text x="440" y="59" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f5132">Maillage Événementiel Hybride — Enveloppes CloudEvents 1.0 • Identités SPIFFE • Traceparent OpenTelemetry</text>

  <rect x="42" y="68" width="364" height="58" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.1"/>
  <text x="224" y="86" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">Solace PubSub+ (Event Mesh Temps Réel &amp; OT)</text>
  <text x="224" y="102" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">Hiérarchies dynamiques (boreal/bel/ot/+/alert) • MQTT / AMQP</text>
  <text x="224" y="117" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#0f5132">Filtrage courtier sous la milliseconde &amp; routage multi-sites</text>

  <line x1="410" y1="97" x2="470" y2="97" stroke="#0f5132" stroke-width="1.6" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="440" y="89" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#0f5132">Pont</text>
  <text x="440" y="111" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">filtré</text>

  <rect x="474" y="68" width="364" height="58" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.1"/>
  <text x="656" y="86" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10.5" font-weight="bold" fill="#0f2744">Confluent / Apache Kafka (Journal d'Événements Immuable)</text>
  <text x="656" y="102" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#334155">Partitions ordonnées • Schema Registry (Apache Ossie) • Claim-Check</text>
  <text x="656" y="117" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" fill="#0f5132">Rejeu déterministe d'audit (BSIF E-23) &amp; DLQ sémantique</text>

  <!-- Connecteurs verticaux Bus <-> Étapes -->
  <line x1="122" y1="138" x2="122" y2="164" stroke="#1e3a5f" stroke-width="1.4" marker-start="url(#arrNavy)" marker-end="url(#arrNavy)"/>
  <line x1="334" y1="138" x2="334" y2="164" stroke="#1e3a5f" stroke-width="1.4" marker-start="url(#arrNavy)" marker-end="url(#arrNavy)"/>
  <line x1="546" y1="138" x2="546" y2="164" stroke="#1e3a5f" stroke-width="1.4" marker-start="url(#arrNavy)" marker-end="url(#arrNavy)"/>
  <line x1="758" y1="138" x2="758" y2="164" stroke="#1e3a5f" stroke-width="1.4" marker-start="url(#arrNavy)" marker-end="url(#arrNavy)"/>

  <!-- Bande 2 : Les 4 étapes de la Saga -->
  <!-- Étape 1 -->
  <rect x="28" y="166" width="188" height="170" rx="5" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
  <rect x="28" y="166" width="188" height="25" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="122" y="183" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f2744">1. Étape Compensable (T1)</text>
  <text x="122" y="205" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#1e3a5f">Agent Stocks BEL (SAP)</text>
  <text x="122" y="220" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Réservation pièce critique</text>
  <text x="122" y="233" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#64748b">Bail TTL = 240 min via MCP</text>

  <rect x="38" y="242" width="168" height="38" rx="3" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
  <text x="122" y="257" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#7c2d12">Transactional Outbox + CDC</text>
  <text x="122" y="271" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Commit BD + événement atomique</text>

  <rect x="38" y="287" width="168" height="40" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="122" y="303" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#991b1b">Action Inverse C1 :</text>
  <text x="122" y="318" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">sap_release_reservation()</text>

  <!-- Étape 2 -->
  <rect x="240" y="166" width="188" height="170" rx="5" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.4"/>
  <rect x="240" y="166" width="188" height="25" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="334" y="183" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f2744">2. Étape Compensable (T2)</text>
  <text x="334" y="205" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#1e3a5f">Agent Terrain BSN (FSM)</text>
  <text x="334" y="220" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Pré-affectation technicien</text>
  <text x="334" y="233" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#64748b">Blocage créneau &amp; camion-grue</text>

  <rect x="250" y="242" width="168" height="38" rx="3" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
  <text x="334" y="257" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#7c2d12">Outbox + Idempotency Key</text>
  <text x="334" y="271" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Zéro doublon en cas de réessai</text>

  <rect x="250" y="287" width="168" height="40" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="334" y="303" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#991b1b">Action Inverse C2 :</text>
  <text x="334" y="318" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">fsm_cancel_slot_allocation()</text>

  <!-- Étape 3 : Pivot -->
  <rect x="452" y="166" width="188" height="170" rx="5" fill="#fffbeb" stroke="#7c2d12" stroke-width="1.8"/>
  <rect x="452" y="166" width="188" height="25" rx="5" fill="#fde68a" stroke="#7c2d12" stroke-width="1"/>
  <text x="546" y="183" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#7c2d12">3. Transaction Pivot (Tp)</text>
  <text x="546" y="205" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f2744">Agent Garantie BCA (IBM i)</text>
  <text x="546" y="220" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Point de bascule décisionnel</text>
  <text x="546" y="233" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#7c2d12">Règles Cedar • BSIF E-23 • CIBA</text>

  <rect x="462" y="242" width="168" height="38" rx="3" fill="#ecfdf5" stroke="#0f5132" stroke-width="1"/>
  <text x="546" y="257" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#0f5132">SUCCÈS → Non-retour</text>
  <text x="546" y="271" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Autorise les étapes réessayables</text>

  <rect x="462" y="287" width="168" height="40" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="546" y="303" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#991b1b">REFUS → Rollback Inverse</text>
  <text x="546" y="318" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">Dépile LIFO : C2 puis C1</text>

  <!-- Étape 4 : Tampon d'actions irréversibles -->
  <rect x="664" y="166" width="188" height="170" rx="5" fill="#f8fafc" stroke="#0f2744" stroke-width="1.6"/>
  <rect x="664" y="166" width="188" height="25" rx="5" fill="#e2e8f0" stroke="#0f2744" stroke-width="1"/>
  <text x="758" y="183" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f2744">4. Tampon Irréversible (T4)</text>
  <text x="758" y="205" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#1e3a5f">Fenêtre de Grâce (120 s)</text>
  <text x="758" y="220" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">Rétention avant effet externe</text>
  <text x="758" y="233" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#64748b">Vérifie absence d'AbortSignal</text>

  <rect x="674" y="242" width="168" height="85" rx="3" fill="#eff6ff" stroke="#1e3a5f" stroke-width="1"/>
  <text x="758" y="258" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#0f2744">Émissions Externes Scellées :</text>
  <text x="758" y="275" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Avis transporteur EDI X12</text>
  <text x="758" y="291" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Courriel d'engagement client</text>
  <text x="758" y="307" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">• Règlement signé AP2 / x402</text>
  <text x="758" y="321" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.2" fill="#1d4ed8">Revérification Cedar JIT</text>

  <!-- Bande 3 : Pistes de flux Aller (bleu/vert) et Compensation Inverse (rouge) -->
  <!-- Piste Aller -->
  <rect x="62" y="348" width="120" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="122" y="363" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8">Aller : T1 validé</text>

  <line x1="184" y1="359" x2="270" y2="359" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrBlue)"/>

  <rect x="274" y="348" width="120" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="334" y="363" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#1d4ed8">Aller : T2 validé</text>

  <line x1="396" y1="359" x2="482" y2="359" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrBlue)"/>

  <rect x="486" y="348" width="120" height="22" rx="11" fill="#fde68a" stroke="#7c2d12" stroke-width="1.2"/>
  <text x="546" y="363" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#7c2d12">Arbitrage Pivot Tp</text>

  <line x1="608" y1="359" x2="690" y2="359" stroke="#0f5132" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <text x="649" y="353" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.2" font-weight="bold" fill="#0f5132">Succès</text>

  <rect x="694" y="348" width="128" height="22" rx="11" fill="#ecfdf5" stroke="#0f5132" stroke-width="1.2"/>
  <text x="758" y="363" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#0f5132">Commit post-grâce</text>

  <!-- Piste Retour (Compensation inverse LIFO) -->
  <rect x="62" y="384" width="120" height="22" rx="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="122" y="399" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#991b1b">2. Exécute C1</text>

  <line x1="272" y1="395" x2="186" y2="395" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrRed)"/>

  <rect x="274" y="384" width="120" height="22" rx="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="334" y="399" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#991b1b">1. Exécute C2</text>

  <line x1="484" y1="395" x2="398" y2="395" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrRed)"/>

  <rect x="486" y="384" width="120" height="22" rx="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="546" y="399" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#991b1b">Refus Conformité</text>

  <line x1="608" y1="395" x2="690" y2="395" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrRed)"/>
  <rect x="694" y="384" width="128" height="22" rx="11" fill="#f1f5f9" stroke="#64748b" stroke-width="1.1"/>
  <text x="758" y="399" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#991b1b">Purge du tampon</text>

  <!-- Bande 4 : Coordinateur de Saga Durable -->
  <rect x="28" y="420" width="824" height="106" rx="6" fill="#eff6ff" stroke="#1e3a5f" stroke-width="1.6"/>
  <text x="440" y="440" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11.2" font-weight="bold" fill="#0f2744">Coordinateur de Saga Durable (Temporal / Restate) — Pile LIFO &amp; Invariants de Résilience</text>

  <rect x="42" y="450" width="254" height="64" rx="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/>
  <text x="169" y="467" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#0f2744">Enregistrement Préalable (Write-Ahead)</text>
  <text x="169" y="483" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Empile Ci sur disque avant d'invoquer Ti</text>
  <text x="169" y="498" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1d4ed8">Aucun effet orphelin en cas de crash</text>

  <rect x="313" y="450" width="254" height="64" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1"/>
  <text x="440" y="467" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#0f5132">Compensation Déterministe vs Sémantique</text>
  <text x="440" y="483" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">API inverse exacte ou écriture rectificative</text>
  <text x="440" y="498" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#0f5132">Zéro suppression destructive comptable</text>

  <rect x="584" y="450" width="254" height="64" rx="4" fill="#ffffff" stroke="#b91c1c" stroke-width="1"/>
  <text x="711" y="467" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.5" font-weight="bold" fill="#991b1b">Garde-Fou SagaDeadLetter (HOTL)</text>
  <text x="711" y="483" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">Réessais bornés avec recul exponentiel</text>
  <text x="711" y="498" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#991b1b">Escalade opérateur si Ci diverge</text>
</svg>
