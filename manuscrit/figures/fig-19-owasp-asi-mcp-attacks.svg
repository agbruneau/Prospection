<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#ffffff"/>
  <text x="440" y="26" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="15" font-weight="bold" fill="#0f2744">Anatomie d'une Attaque Trans-Agent (OWASP ASI &amp; MCP) et Barrières de Rupture Déterministes</text>

  <!-- Bandeau supérieur : Chaîne d'attaque non confinée -->
  <rect x="18" y="42" width="844" height="202" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="34" y="63" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">Chaîne d'Exploitation Offensive Multi-Sauts (En l'absence d'isolation structurelle)</text>

  <!-- Stade 1 -->
  <rect x="30" y="78" width="146" height="148" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="103" y="97" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">1. Entrée Piégée</text>
  <text x="103" y="114" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#1e293b">Injection Indirecte</text>
  <text x="103" y="132" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Bordereau PDF, courriel</text>
  <text x="103" y="146" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">ou billet contenant un</text>
  <text x="103" y="160" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">calque invisible / Unicode</text>
  <text x="103" y="174" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">furtif (U+E0000) lu par</text>
  <text x="103" y="188" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">l'agent d'ingestion</text>
  <text x="103" y="212" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#dc2626">Vecteur Initial</text>

  <line x1="176" y1="152" x2="196" y2="152" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>

  <!-- Stade 2 -->
  <rect x="196" y="78" width="148" height="148" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="270" y="97" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">2. Détournement</text>
  <text x="270" y="114" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#1e293b">ASI01 : Goal Hijack</text>
  <text x="270" y="132" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Confusion données /</text>
  <text x="270" y="146" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">instructions : le LLM</text>
  <text x="270" y="160" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">adopte l'objectif caché</text>
  <text x="270" y="174" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">de l'attaquant (modifier</text>
  <text x="270" y="188" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">un IBAN ou exfiltrer)</text>
  <text x="270" y="212" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#dc2626">ASI01 + ASI03</text>

  <line x1="344" y1="152" x2="364" y2="152" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>

  <!-- Stade 3 -->
  <rect x="364" y="78" width="154" height="148" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="441" y="97" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">3. Pivot Protocole MCP</text>
  <text x="441" y="114" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#1e293b">Poisoning &amp; Rug-Pull</text>
  <text x="441" y="132" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Schéma tools/list piégé,</text>
  <text x="441" y="146" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">mutation post-approbation</text>
  <text x="441" y="160" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">(CVE-2025-54136), Tool</text>
  <text x="441" y="174" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Shadowing inter-serveurs</text>
  <text x="441" y="188" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">ou Confused Deputy</text>
  <text x="441" y="212" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#dc2626">ASI02 + ASI04</text>

  <line x1="518" y1="152" x2="538" y2="152" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>

  <!-- Stade 4 -->
  <rect x="538" y="78" width="148" height="148" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="612" y="97" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">4. Persistance Latente</text>
  <text x="612" y="114" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#1e293b">ASI06 : Memory Poison</text>
  <text x="612" y="132" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Écriture d'une fausse</text>
  <text x="612" y="146" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">règle métier dans l'index</text>
  <text x="612" y="160" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">vectoriel ou la mémoire</text>
  <text x="612" y="174" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">épisodique partagée afin de</text>
  <text x="612" y="188" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#334155">biaiser les sagas futures</text>
  <text x="612" y="212" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#dc2626">ASI06 + ASI07</text>

  <line x1="686" y1="152" x2="706" y2="152" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>

  <!-- Stade 5 -->
  <rect x="706" y="78" width="144" height="148" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <text x="778" y="97" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">5. Impact Systémique</text>
  <text x="778" y="114" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#1e293b">ASI08 : Cascade</text>
  <text x="778" y="132" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Propagation latérale A2A,</text>
  <text x="778" y="146" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">biais d'approbation HOTL</text>
  <text x="778" y="160" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">(ASI09), dérive autonome</text>
  <text x="778" y="174" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">(ASI10) et corruption des</text>
  <text x="778" y="188" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Systems of Record (ERP)</text>
  <text x="778" y="212" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#dc2626">ASI08 + ASI09 + ASI10</text>

  <!-- Flèches d'interception verticales -->
  <line x1="186" y1="292" x2="186" y2="244" stroke="#0f5132" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="441" y1="292" x2="441" y2="244" stroke="#0f5132" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="612" y1="292" x2="612" y2="244" stroke="#0f5132" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="778" y1="292" x2="778" y2="244" stroke="#0f5132" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Bandeau inférieur : Barrières de rupture déterministes -->
  <rect x="18" y="292" width="844" height="190" rx="6" fill="#f0fdf4" stroke="#0f5132" stroke-width="1.6"/>
  <text x="34" y="314" font-family="Segoe UI, Calibri, sans-serif" font-size="11.5" font-weight="bold" fill="#0f5132">Barrières de Rupture Architecturales (Coupure de la Kill Chain à Chaque Frontière)</text>

  <!-- Barrière B1 -->
  <rect x="30" y="328" width="280" height="138" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.3"/>
  <text x="170" y="348" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f5132">Barrière B1 — Isolation Flot de Données</text>
  <text x="170" y="366" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Travailleur SLM d'extraction sans aucun outil</text>
  <text x="170" y="382" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Délimitation Spotlighting &amp; JSON Schema fermé</text>
  <text x="170" y="398" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Purge des points de code Unicode furtifs / Bidi</text>
  <text x="170" y="414" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Marquage de teinte (Taint = UNTRUSTED_EXT)</text>
  <text x="170" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" font-weight="bold" fill="#1d4ed8">Bloque ASI01 à la périphérie documentaire</text>

  <!-- Barrière B2 -->
  <rect x="324" y="328" width="212" height="138" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.3"/>
  <text x="430" y="348" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f5132">Barrière B2 — Verrouillage MCP</text>
  <text x="430" y="366" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Épinglage SHA-256 + Sigstore</text>
  <text x="430" y="382" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Rejet auto de list_changed non signé</text>
  <text x="430" y="398" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Assainisseur de descriptions MCP</text>
  <text x="430" y="414" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Préfixage strict d'espace de noms</text>
  <text x="430" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" font-weight="bold" fill="#1d4ed8">Neutralise ASI02 &amp; ASI04</text>

  <!-- Barrière B3 -->
  <rect x="550" y="328" width="142" height="138" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.3"/>
  <text x="621" y="348" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f5132">Barrière B3 — Mémoire</text>
  <text x="621" y="366" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Provenance HMAC</text>
  <text x="621" y="382" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Quarantaine données</text>
  <text x="621" y="398" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">externes non validées</text>
  <text x="621" y="414" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• TTL &amp; cloisonnement</text>
  <text x="621" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" font-weight="bold" fill="#1d4ed8">Bloque ASI06</text>

  <!-- Barrière B4 -->
  <rect x="706" y="328" width="144" height="138" rx="4" fill="#ffffff" stroke="#0f5132" stroke-width="1.3"/>
  <text x="778" y="348" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f5132">Barrière B4 — Maillage</text>
  <text x="778" y="366" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Signature JWS A2A</text>
  <text x="778" y="382" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Plafond sauts &amp; coût</text>
  <text x="778" y="398" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Vue A2UI différentielle</text>
  <text x="778" y="414" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Red Teaming CI/CD</text>
  <text x="778" y="446" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" font-weight="bold" fill="#1d4ed8">Stoppe ASI07–ASI10</text>
</svg>
