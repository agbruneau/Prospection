  <text x="440" y="92" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#4c1d95">Moteur de Réconciliation Saga</text>
  <text x="440" y="107" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.4" fill="#334155">Fusion CRDT &amp; arbitrage conflits stock</text>

