  <text x="163" y="440" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Planification trajectoire optimale</text>
  <text x="163" y="455" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">Contournement obstacles dynamiques</text>
  <text x="163" y="470" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#64748b">(Non certifié SIL — Haute performance)</text>

