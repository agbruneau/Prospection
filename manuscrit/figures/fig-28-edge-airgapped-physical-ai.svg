  <text x="50" y="268" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Runtime Restate / SQLite WAL local</text>
  <text x="50" y="284" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Agent Skills hors ligne pré-chargés</text>
  <text x="50" y="300" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" font-weight="bold" fill="#1d4ed8">• Latence déterministe &lt; 80 ms</text>
  <text x="50" y="316" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#64748b">• Attestation TPM 2.0 + SPIRE local</text>

