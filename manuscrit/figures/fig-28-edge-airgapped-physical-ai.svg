  <rect x="316" y="404" width="250" height="82" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="441" y="423" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.4" font-weight="bold" fill="#b91c1c">Arbitre Matériel Déterministe</text>
  <text x="441" y="440" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.6" fill="#334155">MCU temps réel isolé (cycle 1 ms)</text>
