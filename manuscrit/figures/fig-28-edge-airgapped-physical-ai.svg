  <text x="440" y="233" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#4c1d95">Magasin d'État CRDT &amp; Quotas</text>
  <text x="326" y="252" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Compteurs PN-Counter (stocks réservés)</text>
  <text x="326" y="268" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Ensembles OR-Set (tâches assignées)</text>
  <text x="326" y="284" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Journal d'intention signé horodaté</text>
  <text x="326" y="300" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" font-weight="bold" fill="#4c1d95">• Enveloppe d'escrow hors ligne bornée</text>
  <text x="326" y="316" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#64748b">• Zéro blocage sur perte WAN</text>

  <rect x="590" y="214" width="252" height="118" rx="5" fill="#ffffff" stroke="#0f5132" stroke-width="1.2"/>
  <text x="716" y="233" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.6" font-weight="bold" fill="#0f5132">Passerelle MCP ↔ ROS 2 (DDS)</text>
  <text x="602" y="252" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Traduction missions A2A en Action ROS 2</text>
  <text x="602" y="268" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Abstraction topologique (waypoints)</text>
  <text x="602" y="284" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" fill="#334155">• Zéro commande couple moteur par LLM</text>
  <text x="602" y="300" font-family="Segoe UI, Calibri, sans-serif" font-size="8.7" font-weight="bold" fill="#0f5132">• Validation pré-exécution sur carte 3D</text>
  <text x="602" y="316" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" fill="#64748b">• QoS DDS temps réel fiable</text>

  <!-- Flèches vers Physical AI Simplex -->
  <line x1="716" y1="332" x2="716" y2="368" stroke="#0f5132" stroke-width="1.6" marker-end="url(#arrGreen28)"/>
  <line x1="164" y1="332" x2="240" y2="368" stroke="#0f2744" stroke-width="1.5" marker-end="url(#arrNavy28)"/>

