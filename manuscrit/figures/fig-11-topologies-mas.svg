  <text x="40" y="230" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Complexité messages : O(k) délégations A2A</text>
  <text x="40" y="245" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#334155">• Force : Gouvernance et traçabilité simples</text>
