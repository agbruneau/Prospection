  <text x="440" y="42" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" fill="#475569">Du contrôle hiérarchique centralisé à l'allocation par marché interne et à l'encapsulation réglementaire BPMN/DMN</text>

