<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500">
  <defs>
    <marker id="arrNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f2744"/>
    </marker>
    <marker id="arrBlue12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrGreen12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f5132"/>
    </marker>
    <marker id="arrRed12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#991b1b"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#ffffff"/>

  <!-- Titre -->
  <text x="440" y="25" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="14.5" font-weight="bold" fill="#0f2744">Mécanisme d'Exécution Durable : Journal d'Événements, Barrière d'Effets de Bord et Rejeu sur Crash</text>
  <text x="440" y="42" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="10" fill="#475569">Séparation stricte entre logique déterministe rejouable et activités non déterministes (LLM, MCP, A2A, approbation CIBA)</text>

  <!-- Colonne Gauche : Plan Déterministe -->
  <rect x="20" y="58" width="248" height="330" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="144" y="79" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#0f2744">1. Workflow Déterministe</text>
  <text x="144" y="94" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#1d4ed8">(Zéro E/S directe • Horloge virtuelle)</text>

  <rect x="34" y="108" width="220" height="44" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="144" y="126" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">Étape A : Planification &amp; Triage</text>
  <text x="144" y="141" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.2" fill="#334155">await executeActivity(extractClaim)</text>

  <rect x="34" y="164" width="220" height="44" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="144" y="182" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">Étape B : Mutation MCP Bornée</text>
  <text x="144" y="197" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.2" fill="#334155">await executeActivity(reserveHold)</text>

  <rect x="34" y="220" width="220" height="52" rx="4" fill="#fff7ed" stroke="#9a3412" stroke-width="1.3"/>
  <text x="144" y="238" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#7c2d12">Étape C : Mise en veille Awakeable</text>
  <text x="144" y="252" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.2" fill="#9a3412">condition(cibaApproved, '14 days')</text>
  <text x="144" y="265" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8" font-weight="bold" fill="#0f5132">Mémoire libérée : 0 CPU / 0 RAM</text>

  <rect x="34" y="284" width="220" height="44" rx="4" fill="#ecfdf5" stroke="#0f5132" stroke-width="1.3"/>
  <text x="144" y="302" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f5132">Étape D : Revalidation au Réveil</text>
  <text x="144" y="317" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.2" fill="#334155">Vérification contrat, jeton OBO &amp; quota</text>

  <rect x="34" y="338" width="220" height="38" rx="4" fill="#ffffff" stroke="#0f2744"/>
  <text x="144" y="355" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9" font-weight="bold" fill="#0f2744">Étape E : Règlement &amp; Audit</text>
  <text x="144" y="368" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8" fill="#475569">Clôture transactionnelle immuable</text>

  <!-- Colonne Centrale : Journal d'Événements Immuable -->
  <rect x="296" y="58" width="288" height="330" rx="6" fill="#f8fafc" stroke="#0f2744" stroke-width="1.8"/>
  <text x="440" y="79" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#0f2744">2. Journal d'Événements Immuable</text>
  <text x="440" y="94" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">(Append-Only Event History • Persistance Consensus)</text>

  <rect x="312" y="108" width="256" height="32" rx="3" fill="#ffffff" stroke="#64748b"/>
  <text x="322" y="122" font-family="Segoe UI, Calibri, sans-serif" font-size="8.3" font-weight="bold" fill="#0f2744">#1-#3 ActivityCompleted [extractClaim]</text>
  <text x="322" y="134" font-family="Segoe UI, Calibri, sans-serif" font-size="7.8" fill="#0f5132">Sortie LLM sérialisée &amp; chiffrée AES-GCM</text>

  <rect x="312" y="148" width="256" height="32" rx="3" fill="#ffffff" stroke="#64748b"/>
  <text x="322" y="162" font-family="Segoe UI, Calibri, sans-serif" font-size="8.3" font-weight="bold" fill="#0f2744">#4-#6 ActivityCompleted [reserveHold]</text>
  <text x="322" y="174" font-family="Segoe UI, Calibri, sans-serif" font-size="7.8" fill="#0f5132">Réservation idempotente confirmée (clé #4)</text>

  <rect x="312" y="188" width="256" height="30" rx="3" fill="#fff7ed" stroke="#9a3412"/>
  <text x="322" y="202" font-family="Segoe UI, Calibri, sans-serif" font-size="8.3" font-weight="bold" fill="#7c2d12">#7 TimerStarted / AwakeableRegistered</text>
  <text x="322" y="213" font-family="Segoe UI, Calibri, sans-serif" font-size="7.8" fill="#9a3412">Attente signal externe (Jour 1 -&gt; Jour 9)</text>

  <!-- Événement Crash + Replay -->
  <rect x="312" y="228" width="256" height="58" rx="4" fill="#fef2f2" stroke="#991b1b" stroke-width="1.4"/>
  <text x="440" y="244" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" font-weight="bold" fill="#991b1b">Jour 5 : Crash Nœud K8s + Déploiement v2.4</text>
  <text x="440" y="258" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.1" fill="#7f1d1d">Nouveau Worker rejoue #1 à #7 en 3,8 ms :</text>
  <text x="440" y="272" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.1" font-weight="bold" fill="#0f5132">Zéro rappel LLM • Zéro double débit MCP!</text>

  <rect x="312" y="296" width="256" height="34" rx="3" fill="#ecfdf5" stroke="#0f5132"/>
  <text x="322" y="310" font-family="Segoe UI, Calibri, sans-serif" font-size="8.3" font-weight="bold" fill="#0f5132">#8 WorkflowExecutionSignaled [CIBA_OK]</text>
  <text x="322" y="322" font-family="Segoe UI, Calibri, sans-serif" font-size="7.8" fill="#334155">Jeton signé du souscripteur reçu au Jour 9</text>

  <rect x="312" y="338" width="256" height="38" rx="3" fill="#ffffff" stroke="#0f2744"/>
  <text x="322" y="353" font-family="Segoe UI, Calibri, sans-serif" font-size="8.3" font-weight="bold" fill="#0f2744">#9-#12 Revalidation + Règlement Final</text>
  <text x="322" y="366" font-family="Segoe UI, Calibri, sans-serif" font-size="7.8" fill="#475569">Piste d'audit intégrale conforme BSIF E-23</text>

  <!-- Barrière verticale pointillée d'effets de bord -->
  <line x1="598" y1="58" x2="598" y2="388" stroke="#991b1b" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="598" y="403" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.5" font-weight="bold" fill="#991b1b">Barrière d'Effets de Bord</text>

  <!-- Colonne Droite : Monde Non Déterministe -->
  <rect x="612" y="58" width="248" height="330" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="736" y="79" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="11" font-weight="bold" fill="#0f2744">3. Activités Non Déterministes</text>
  <text x="736" y="94" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.8" fill="#475569">(Exécutées 1 seule fois ou idempotentes)</text>

  <rect x="626" y="110" width="220" height="54" rx="4" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="736" y="128" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#1d4ed8">Inférence LLM / SLM (Open Responses)</text>
  <text x="736" y="143" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.2" fill="#334155">Sortie probabiliste capturée dans #3</text>
  <text x="736" y="156" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8" fill="#64748b">Politique Retry sur HTTP 429 / 503</text>

  <rect x="626" y="178" width="220" height="58" rx="4" fill="#ffffff" stroke="#0f5132"/>
  <text x="736" y="196" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f5132">Serveurs MCP &amp; Pairs A2A v1.0</text>
  <text x="736" y="211" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.2" fill="#334155">Clé = hash(workflowId + activityId)</text>
  <text x="736" y="225" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8" fill="#0f5132">Déduplication native côté SAP / Guidewire</text>

  <rect x="626" y="250" width="220" height="58" rx="4" fill="#ffffff" stroke="#9a3412"/>
  <text x="736" y="268" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#7c2d12">Superviseur Humain HOTL (CIBA)</text>
  <text x="736" y="283" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.2" fill="#334155">Notification asynchrone A2UI hors bande</text>
  <text x="736" y="297" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8" fill="#9a3412">Callback webhook résolvant l'Awakeable</text>

  <rect x="626" y="322" width="220" height="52" rx="4" fill="#ffffff" stroke="#0f2744"/>
  <text x="736" y="340" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="9.2" font-weight="bold" fill="#0f2744">Passerelle IAM &amp; Politiques Cedar</text>
  <text x="736" y="355" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8.2" fill="#334155">Rafraîchissement jeton OAuth 2.1 OBO</text>
  <text x="736" y="367" text-anchor="middle" font-family="Segoe UI, Calibri, sans-serif" font-size="8" fill="#64748b">Vérification non-révocation post-réveil</text>

  <!-- Flèches inter-colonnes -->
  <line x1="268" y1="128" x2="310" y2="124" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrBlue12)"/>
  <line x1="268" y1="184" x2="310" y2="164" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrBlue12)"/>
  <line x1="310" y1="256" x2="268" y2="256" stroke="#991b1b" stroke-width="1.5" marker-end="url(#arrRed12)"/>
  <line x1="568" y1="124" x2="624" y2="132" stroke="#0f2744" stroke-width="1.5" marker-end="url(#arrNavy)"/>
  <line x1="568" y1="164" x2="624" y2="202" stroke="#0f5132" stroke-width="1.5" marker-end="url(#arrGreen12)"/>
  <line x1="624" y1="286" x2="568" y2="310" stroke="#0f5132" stroke-width="1.5" marker-end="url(#arrGreen12)"/>

  <!-- Bandeau synthèse inférieur -->
  <rect x="20" y="418" width="840" height="66" rx="6" fill="#f8fafc" stroke="#0f2744" stroke-width="1.2"/>
  <text x="38" y="438" font-family="Segoe UI, Calibri, sans-serif" font-size="10" font-weight="bold" fill="#0f2744">Garanties architecturales d'exécution durable pour systèmes multi-agents (2027) :</text>
  <text x="38" y="456" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">1. Exactement-une-fois logique (Effectively-Once) : au rejeu, le moteur injecte la réponse mémorisée du journal sans réinvoquer le LLM ni l'outil MCP.</text>
  <text x="38" y="473" font-family="Segoe UI, Calibri, sans-serif" font-size="9" fill="#334155">2. Économie infonuagique (Scale-to-Zero) : un dossier suspendu 14 jours ne maintient aucun processus actif ni connexion TCP ouverte en attente.</text>
</svg>
